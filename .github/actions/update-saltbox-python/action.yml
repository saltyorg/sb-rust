# Saltbox's Python toolchain from a stable sb release (release spec,
# "Saltbox's toolchain update"), ported from sb-go's action of the same
# name (4006309) in two modes, each its own job:
# - prepare (no token): finds the newest CPython the released uv supports,
#   preflights Saltbox's requirements on it, prints the diff and leaves the
#   four files in `directory`. sb-go's dry run is this mode.
# - commit (the App's token): commits those files to Saltbox's master,
#   signed, if master hasn't moved. No package code runs in this mode.
name: Update Saltbox Python
description: Prepare, then commit signed, Saltbox Python updates using versions supported by the released uv

inputs:
  mode:
    description: prepare or commit
    required: true
  token:
    description: Token with permission to update the Saltbox repository (commit mode only)
    required: false
    default: ''
  saltbox-repository:
    description: Saltbox repository
    required: false
    default: saltyorg/Saltbox
  python-minor:
    description: Python minor release to track
    required: false
    default: '3.12'
  sb-release:
    description: Published sb release containing the uv pin
    required: true
  uv-version:
    description: Exact uv release embedded in the published sb binary (its version --json uv_version)
    required: true
  directory:
    description: Absolute path the prepare mode writes the update to (it must not exist yet) and the commit mode reads it from
    required: true

outputs:
  changed:
    description: Whether the prepared update changes Saltbox (prepare mode)
    value: ${{ steps.prepare.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Check the mode
      if: inputs.mode != 'prepare' && inputs.mode != 'commit'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        echo "Unknown mode: $MODE (prepare or commit)" >&2
        exit 1

    - name: Discover supported Python and prepare Saltbox's update
      id: prepare
      if: inputs.mode == 'prepare'
      shell: bash
      env:
        SALTBOX_REPOSITORY: ${{ inputs.saltbox-repository }}
        PYTHON_MINOR: ${{ inputs.python-minor }}
        SB_RELEASE: ${{ inputs.sb-release }}
        UV_VERSION: ${{ inputs.uv-version }}
        OUTPUT_DIR: ${{ inputs.directory }}
      run: '"$GITHUB_ACTION_PATH/update.sh"'

    - name: Commit the prepared update to Saltbox
      if: inputs.mode == 'commit'
      shell: bash
      env:
        SALTBOX_TOKEN: ${{ inputs.token }}
        SALTBOX_REPOSITORY: ${{ inputs.saltbox-repository }}
        SB_RELEASE: ${{ inputs.sb-release }}
        UV_VERSION: ${{ inputs.uv-version }}
        INPUT_DIR: ${{ inputs.directory }}
      run: '"$GITHUB_ACTION_PATH/publish.sh"'
