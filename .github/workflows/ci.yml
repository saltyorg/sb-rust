# sb's gate on every push and pull request (release spec, "Release
# channels", CI): `scripts/check.sh task` on each supported Ubuntu release
# and on arm64, as CONSTRAINTS.md asks of `task` ("before handing work
# back"). `full` runs on release tags (release.yml).
#
# Written locally (2026-11-18) and not yet run: creating saltyorg/sb-rust,
# pushing and running workflows are remote actions the maintainer
# authorises separately. GitHub's 26.04 and arm runners are generally
# available; its 22.04 images are deprecated from 2026-09-17 and
# unsupported from 2027-04-17, when those two jobs need a plan.
# https://github.com/actions/runner-images
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  task:
    name: task / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # arm64 ships (maintainer, 2026-11-18): its tests run natively on
        # the arm runners, as emulated runs would be slow and flaky.
        # The 26.04 labels are newer than the pinned actionlint: they are
        # in .github/actionlint.yaml, with GitHub's source.
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
      # The tools at CONSTRAINTS.md's Tools pins, prebuilt (nextest's own
      # docs point CI at this action:
      # https://nexte.st/docs/installation/pre-built-binaries/); check.sh
      # refuses any other version before a stage runs. `fallback: none`:
      # the action checks each release archive's SHA-256 from its own
      # manifest, and a tool it has no release for is an error instead of
      # its default fallback, cargo-binstall, unchecked by the action
      # (https://github.com/taiki-e/install-action/blob/v2.90.8/README.md, "Inputs").
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151,cargo-deny@0.20.2,hyperfine@2.0.0,zizmor@1.32.0,uv@0.13.4
          fallback: none
      # cargo-mutants publishes no aarch64 Linux build (the action's
      # manifest for 27.1.0 has x86_64 alone:
      # https://github.com/taiki-e/install-action/blob/v2.90.8/manifests/cargo-mutants.json),
      # so arm64 builds it from crates.io, each crate checked against the
      # index's checksum, its dependencies at its own Cargo.lock.
      - name: cargo-mutants (x86_64)
        if: runner.arch == 'X64'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - name: cargo-mutants (arm64)
        if: runner.arch == 'ARM64'
        run: cargo install --locked cargo-mutants --version 27.1.0
      # diff-cover from its hash-pinned lock, in a virtual environment of
      # its own (scripts/install-diff-cover.sh), with the uv above, at the
      # version sb installs (crates/cli-core/src/build_info.rs).
      - name: gitleaks, diff-cover and actionlint
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          scripts/install-diff-cover.sh "$RUNNER_TEMP/diff-cover" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          rustup component add llvm-tools
      # A pull request is checked against what it merges into; a push to
      # main with no base checks everything (check.sh: nothing changed
      # since the base runs every step). As root, as check.sh runs its
      # sandbox.
      - name: check.sh task
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=HEAD
          if [[ -n ${BASE_REF} ]]; then
            base=$(git merge-base "origin/${BASE_REF}" HEAD)
          fi
          sudo --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME env "PATH=$PATH" \
            scripts/check.sh task "$base"
      # The root run leaves root-owned files where rust-cache's post step,
      # as the runner user, saves from.
      - name: Hand the build back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target "${CARGO_HOME:-$HOME/.cargo}"

  # sb-go's build.yml checks, on a build made the way releases are but
  # untagged (so on tag pushes too): `version --json` has a valid
  # uv_version, and with no SB_VERSION self-update is disabled.
  untagged:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build without SB_VERSION
        run: cargo build --locked --release -p sb
      - name: uv_version is a version
        run: |
          target/release/sb version --json | tee version.json
          jq -e '.uv_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' version.json
          jq -e '.channel == "none"' version.json
      - name: Self-update is disabled
        run: |
          out=$(sudo SB_LOG_DIR="$RUNNER_TEMP/sb-log" target/release/sb self-update 2>&1)
          printf '%s\n' "$out"
          grep -Fq "Self-update is disabled in this build" <<<"$out"
