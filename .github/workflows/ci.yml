# sb's gate on every push to main and every pull request (release spec,
# "Release channels", CI): `scripts/check.sh task` on each supported Ubuntu
# release and on arm64, as CONSTRAINTS.md asks of `task` ("before handing
# work back"). `full` runs on release tags (release.yml).
#
# GitHub's 26.04 and arm runners are generally available; its 22.04
# images are deprecated from 2026-09-17 and unsupported from 2027-04-17,
# when those two jobs need a plan.
# https://github.com/actions/runner-images
name: ci

# Pushes to main only: a pull request from a branch of this repository
# (Renovate's among them) would otherwise run twice, once for the push and
# once for the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push to a pull request cancels its older run. Each push to main
# has a group of its own (its run's id): GitHub keeps one pending run per
# group and cancels the one before, so a shared group could leave a
# commit on main with no ci run for release.yml's plan to find.
# https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#concurrency
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  task:
    name: task / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # arm64 ships (maintainer, 2026-11-18): its tests run natively on
        # the arm runners, as emulated runs would be slow and flaky.
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      # Keyed by the runner too: rust-cache's own key holds the job id and
      # the runner's OS family and CPU architecture, not its Ubuntu
      # release, so a 22.04 job could restore a target/ built against a
      # newer release's glibc and fail to link on symbols 22.04's glibc
      # lacks. `key` is added beside the job-based key, in the restore key
      # too, so no release falls back to another's cache:
      # https://github.com/Swatinem/rust-cache/blob/v2.9.3/README.md
      # (`key`, and "Cache Details"), and the key's making in
      # https://github.com/Swatinem/rust-cache/blob/v2.9.3/src/config.ts
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The tools at CONSTRAINTS.md's Tools pins, prebuilt (nextest's own
      # docs point CI at this action:
      # https://nexte.st/docs/installation/pre-built-binaries/); check.sh
      # refuses any other version before a stage runs. `fallback: none`:
      # the action checks each release archive's SHA-256 from its own
      # manifest, and a tool it has no release for is an error instead of
      # its default fallback, cargo-binstall, unchecked by the action
      # (https://github.com/taiki-e/install-action/blob/v2.90.8/README.md, "Inputs").
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151,cargo-deny@0.20.2,hyperfine@2.0.0,zizmor@1.32.0,uv@0.13.4
          fallback: none
      # cargo-mutants from crates.io on every runner, as its own docs
      # install it (https://mutants.rs/installation.html), each crate
      # checked against the index's checksum, its dependencies at its own
      # Cargo.lock. Its 27.1.0 release has one Linux build, x86_64 glibc
      # (https://github.com/taiki-e/install-action/blob/v2.90.8/manifests/cargo-mutants.json),
      # which needs glibc 2.39 and doesn't start on 22.04's 2.35; there is
      # no aarch64 one at all.
      - name: cargo-mutants
        run: cargo install --locked cargo-mutants --version 27.1.0
      # Python 3.12, which scripts/install-check-jsonschema.sh makes
      # check-jsonschema's environment on, the same on every Ubuntu release.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # gitleaks from its release's prebuilt binary, checked against the
      # release's checksums (scripts/install-gitleaks.sh); diff-cover and
      # check-jsonschema from their hash-pinned locks, each in a virtual
      # environment of its own (scripts/install-diff-cover.sh,
      # scripts/install-check-jsonschema.sh), with the uv above, at the
      # version sb installs (crates/cli-core/src/build_info.rs).
      - name: gitleaks, diff-cover and check-jsonschema
        run: |
          scripts/install-gitleaks.sh "$RUNNER_TEMP/bin"
          scripts/install-diff-cover.sh "$RUNNER_TEMP/diff-cover" "$RUNNER_TEMP/bin"
          scripts/install-check-jsonschema.sh "$RUNNER_TEMP/check-jsonschema" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          rustup component add llvm-tools
      # check.sh task runs against a base: for a pull request its merge
      # base, for a push the commit the push moved the branch from (the
      # push event's `before`: "The SHA of the most recent commit on ref
      # before the push",
      # https://docs.github.com/en/webhooks/webhook-events-and-payloads#push),
      # so the push's own diff selects the steps and gets changed-line
      # coverage, as a pull request's does. The mutation passes are the
      # local gate's (the maintainer, 2026-11-26), for pushes and pull
      # requests: SB_GATE_MUTATION=off, kept through sudo with
      # GITHUB_ACTIONS, which check.sh asks for beside it. Most mutants run
      # every crate's tests, about 2 min a mutant on a 4-vCPU runner in
      # the CI rehearsal, against this job's 120-minute limit, and a
      # push's diff can hold dozens. A push with no
      # usable earlier commit runs every step against HEAD and says why: a
      # new branch (git's all-zeros name for no commit), or a `before` the
      # clone doesn't have or that isn't an ancestor of HEAD (a force
      # push). The clone has every branch and tag (fetch-depth 0). As root, as check.sh
      # runs its sandbox. The root tests are asked for explicitly,
      # SB_TEST_ROOT=1 kept through sudo: check.sh refuses the ask in a
      # run that isn't root, so a run that lost its root fails instead of
      # skipping them.
      - name: check.sh task
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SB_TEST_ROOT: "1"
          SB_GATE_MUTATION: "off"
        run: |
          base=HEAD
          if [[ -n ${BASE_REF} ]]; then
            base=$(git merge-base "origin/${BASE_REF}" HEAD)
          elif [[ -z ${BEFORE} || ${BEFORE} =~ ^0+$ ]]; then
            echo "check.sh task: the push has no earlier commit; every step runs against HEAD"
          elif ! git cat-file -e "${BEFORE}^{commit}"; then
            echo "check.sh task: the push's earlier commit ${BEFORE} isn't in the clone (a force push?); every step runs against HEAD"
          elif git merge-base --is-ancestor "${BEFORE}" HEAD; then
            base=${BEFORE}
          else
            echo "check.sh task: the push's earlier commit ${BEFORE} isn't an ancestor of HEAD; every step runs against HEAD"
          fi
          sudo --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME,SB_TEST_ROOT,SB_GATE_MUTATION,GITHUB_ACTIONS \
            env "PATH=$PATH" \
            scripts/check.sh task "$base"
      # The root run leaves root-owned files where rust-cache's post step,
      # as the runner user, saves from.
      - name: Hand the build back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target "${CARGO_HOME:-$HOME/.cargo}"

  # zizmor online (the maintainer, 2026-11-24). With a token it also runs
  # the audits that ask GitHub: among them ref-version-mismatch, that each
  # hash pin's version comment names a tag pointing at that commit (offline,
  # it reports nothing), and impostor-commit, that the pinned commit is in
  # the action's own repository and not only in a fork:
  # https://docs.zizmor.sh/usage/#operating-modes,
  # https://docs.zizmor.sh/audits/#ref-version-mismatch,
  # https://docs.zizmor.sh/audits/#impostor-commit
  # The token is the job's GITHUB_TOKEN with contents: read alone; zizmor
  # only reads the actions' public repositories. check.sh, the local gate,
  # stays offline.
  zizmor-online:
    name: "zizmor (online)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: zizmor@1.32.0
          fallback: none
      # Without a token zizmor skips the online audits and still passes, so
      # a missing one fails the step.
      - name: zizmor (online audits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${GH_TOKEN:?no token: zizmor would skip its online audits}"
          zizmor --persona=auditor --no-progress .github/

  # sb-go's build.yml checks, on a build made the way releases are but
  # untagged: `version --json` has a valid uv_version, and with no
  # SB_VERSION self-update is disabled.
  untagged:
    name: untagged build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build without SB_VERSION
        run: cargo build --locked --release -p sb
      - name: uv_version is a version
        run: |
          target/release/sb version --json | tee version.json
          jq -e '.uv_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' version.json
          jq -e '.channel == "none"' version.json
      - name: Self-update is disabled
        run: |
          out=$(sudo SB_LOG_DIR="$RUNNER_TEMP/sb-log" target/release/sb self-update 2>&1)
          printf '%s\n' "$out"
          grep -Fq "Self-update is disabled in this build" <<<"$out"
