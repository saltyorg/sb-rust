# A release from a version tag (release spec, "Release channels"): the
# whole gate, the by-hand container suites, then each asset built with its
# version, commit and channel baked in, checked, and published with notes
# made from the commits; then the Discord announcement and, for a stable
# release only, Saltbox's Python toolchain update (release spec, "Release
# notes and announcement" and "Saltbox's toolchain update").
#
# Tags are bare semantic versions: `1.0.0` (stable) or `1.0.0-rc.N` (a
# prerelease). A stable tag publishes the plain `release` assets and the
# `_beta` ones, from the same code, so a beta host stays beta across
# stable releases; a prerelease publishes `_beta` assets only.
#
# Written locally (2026-11-18, the notes, Discord and Saltbox jobs
# 2026-11-20) and not yet run: pushing tags, publishing and updating
# Saltbox are remote actions the maintainer authorises separately (and the
# user rules ask for green CI on the exact commit before any tag is
# pushed).
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release reaches every host on its channel as root (`sb update`
  # self-updates without a question), so only a commit on main whose ci
  # run passed is released (the user rules: green CI on the exact commit
  # before a tag). The tag is semver without leading zeros, as semver
  # reads it.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      assets: ${{ steps.plan.outputs.assets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The commit is on main and its ci passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          [[ $passed -gt 0 ]] || { echo "ci.yml has no successful run on $GITHUB_SHA" >&2; exit 1; }
      - id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          n='(0|[1-9][0-9]*)'
          [[ $TAG =~ ^$n\.$n\.$n(-rc\.$n)?$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          echo "version=$TAG" >>"$GITHUB_OUTPUT"
          if [[ $TAG == *-rc.* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
            echo 'assets=[{"arch":"amd64","channel":"beta"},{"arch":"arm64","channel":"beta"}]' >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
            echo 'assets=[{"arch":"amd64","channel":"release"},{"arch":"arm64","channel":"release"},{"arch":"amd64","channel":"beta"},{"arch":"arm64","channel":"beta"}]' >>"$GITHUB_OUTPUT"
          fi
      # The notes, from the commits since the previous release tag (a
      # stable release's previous stable one), made here so that a broken
      # history fails before the gate's hours.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release.sh notes "$TAG" "$GITHUB_REPOSITORY" >"$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # `check.sh full` with no base: every step, the production build's size,
  # its runs on each release and the aarch64 build under QEMU included.
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,hyperfine@2.0.0,cross@0.2.5
      - name: gitleaks and diff-cover
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          pipx install diff-cover==9.7.2
          rustup component add llvm-tools
      - name: check.sh full
        run: sudo --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME env "PATH=$PATH" scripts/check.sh full

  # The test suite on arm64, natively (its full gate's x86_64-only steps
  # ran above).
  gate-arm64:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,hyperfine@2.0.0
      - name: gitleaks and diff-cover
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          pipx install diff-cover==9.7.2
          rustup component add llvm-tools
      - name: check.sh task
        run: sudo --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME env "PATH=$PATH" scripts/check.sh task

  # The suites CONSTRAINTS.md and the specs run by hand at each checkpoint:
  # the completion shells, the journal matrix and, once a stable release
  # exists for its live --repair cases, the install-script containers.
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5
      - name: Completion shells
        run: |
          cargo build --locked -p sb
          crates/completion/tests/shells.sh
      - name: Journal matrix
        run: |
          bin=$(crates/journal/tests/example.sh)
          for release in 22.04 24.04 26.04; do
            SBJ_BIN=$bin crates/journal/tests/compare.sh "$release"
            SBJ_BIN=$bin crates/journal/tests/compat.sh 22.04 20.04 18.04 -- "$release"
            SBJ_BIN=$bin crates/journal/tests/follow.sh "$release"
            SBJ_BIN=$bin crates/journal/tests/stress.sh "$release"
          done
      # The token only for the probe, not for the build or the suite.
      - name: A stable release exists
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "no stable release yet: the --repair cases have nothing to fetch"
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Install-script containers
        if: steps.released.outputs.exists == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SB_VERSION=$TAG SB_GIT_COMMIT=${GITHUB_SHA::7} SB_CHANNEL=release \
            cargo build --locked --release -p sb
          SBI_SB=$PWD/target/release/sb install/tests/containers.sh

  build:
    needs: [plan, gate, gate-arm64, containers]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        asset: ${{ fromJSON(needs.plan.outputs.assets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5
      # Cross.toml passes SB_VERSION, SB_GIT_COMMIT and SB_CHANNEL into
      # cross's container (sb-M4).
      - name: Build
        env:
          SB_VERSION: ${{ needs.plan.outputs.version }}
          SB_CHANNEL: ${{ matrix.asset.channel }}
          ARCH: ${{ matrix.asset.arch }}
        run: |
          export SB_GIT_COMMIT=${GITHUB_SHA::7}
          target=x86_64-unknown-linux-gnu
          [[ $ARCH == arm64 ]] && target=aarch64-unknown-linux-gnu
          CARGO_TARGET_DIR=$PWD/target/cross-gnu cross build --locked -p sb --profile production --target "$target"
          name=sb_linux_${ARCH}
          [[ $SB_CHANNEL == beta ]] && name=${name}_beta
          mkdir -p dist
          cp "target/cross-gnu/$target/production/sb" "dist/$name"
          echo "ASSET=dist/$name" >>"$GITHUB_ENV"
      # The binary reports the tag's version, its own channel and a valid
      # uv_version: amd64 run directly, arm64 under QEMU user-mode.
      - name: Check
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ matrix.asset.channel }}
          ARCH: ${{ matrix.asset.arch }}
        run: |
          if [[ $ARCH == arm64 ]]; then
            sum=$(sha256sum build/qemu.Dockerfile)
            image="sb-rust-gate/qemu-check:${sum:0:12}"
            docker build --quiet --tag "$image" --file build/qemu.Dockerfile build
            json=$(docker run --rm --network none -e SB_LOG_DIR=/tmp/sb-log -v "$PWD/$ASSET:/sb:ro" \
              "$image" qemu-aarch64-static -L /usr/aarch64-linux-gnu /sb version --json)
          else
            json=$(SB_LOG_DIR=$RUNNER_TEMP/sb-log "$ASSET" version --json)
          fi
          printf '%s\n' "$json"
          jq -e --arg v "$VERSION" --arg c "$CHANNEL" \
            '.version == $v and .channel == $c and (.uv_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$json"
      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.asset.arch }}-${{ matrix.asset.channel }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # The `release` environment's required reviewers approve each
  # publication (set up with the repository: a remote setting the
  # maintainer authorises separately).
  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      # Exactly the plan's assets: an `asset-*` artifact another job of the
      # run uploaded is no asset.
      - name: The assets are the plan's
        env:
          ASSETS: ${{ needs.plan.outputs.assets }}
        run: |
          want=$(jq -r '.[] | "sb_linux_\(.arch)\(if .channel == "beta" then "_beta" else "" end)"' <<<"$ASSETS" | sort)
          got=$(find dist -mindepth 1 -printf '%P\n' | sort)
          [[ $got == "$want" ]] || { printf 'dist has:\n%s\nnot the plan'"'"'s:\n%s\n' "$got" "$want" >&2; exit 1; }
      # The action would create a missing tag on target_commitish; the
      # release is only ever the built commit's.
      - name: The tag still names the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          read -r type sha < <(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')
          if [[ $type == tag ]]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')
          fi
          [[ $sha == "$GITHUB_SHA" ]] || { echo "tag $TAG names $sha, not the built $GITHUB_SHA" >&2; exit 1; }
      # GitHub records each asset's sha256 digest, which self-update
      # requires (release spec, assumption 3); install.sh checks the pinned
      # URL, the ELF machine, the version and the channel instead.
      # As sb-go publishes, with softprops/action-gh-release and the notes
      # as the body: https://github.com/softprops/action-gh-release
      # make_latest `legacy`: GitHub marks the highest stable version
      # latest, so a backport (1.0.5 after 1.1.0) doesn't become
      # install.sh's; a prerelease is never latest:
      # https://docs.github.com/en/rest/releases/releases#create-a-release
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.plan.outputs.version }}
          body_path: notes/release-notes.md
          draft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          make_latest: ${{ needs.plan.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          files: dist/*
          fail_on_unmatched_files: true

  # sb-go's "Notify Discord" step, as its own job: no write token, and a
  # failed post leaves the publication alone (re-run this job only). The
  # payload is built (and so checked) on every release; it is sent when
  # the DISCORD_WEBHOOK secret is set.
  announce:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      # The payload is built without the secret in reach; only the post
      # step has it.
      - name: Discord payload
        env:
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          scripts/release.sh discord "$TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/notes/release-notes.md" \
            "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >"$RUNNER_TEMP/discord.json"
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [[ -z $DISCORD_WEBHOOK ]]; then
            echo "DISCORD_WEBHOOK isn't set: no announcement"
          else
            curl --fail-with-body --silent --show-error --proto =https --max-time 30 \
              -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/discord.json" "$DISCORD_WEBHOOK"
          fi

  # Saltbox's Python toolchain from a published stable release (release
  # spec, "Saltbox's toolchain update"), sb-go's update-saltbox-python
  # job, ported. It never writes to Saltbox for a prerelease: the gate
  # below decides (scripts/release.sh saltbox-gate, tested), and the two
  # jobs after it are skipped unless it says run=true.
  saltbox-gate:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      uv-version: ${{ steps.gate.outputs.uv-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # GitHub's record of the published release, and the published
      # sb_linux_amd64's own report (a prerelease has no such asset).
      - id: gate
        name: The release is a published stable one
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          dir=$RUNNER_TEMP/saltbox-gate
          mkdir -p "$dir"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >"$dir/release.json"
          if jq -e 'any(.assets[]?; .name == "sb_linux_amd64")' "$dir/release.json" >/dev/null; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern sb_linux_amd64 --dir "$dir/bin"
            chmod 0755 "$dir/bin/sb_linux_amd64"
            env -u GH_TOKEN SB_LOG_DIR="$dir/sb-log" "$dir/bin/sb_linux_amd64" version --json >"$dir/version.json"
          fi
          scripts/release.sh saltbox-gate "$TAG" "$dir/release.json" "$dir/version.json" | tee -a "$GITHUB_OUTPUT"

  # The preflight runs Saltbox's requirements' own code (their builds and
  # entry points), so it has no write token; the commit below has the
  # token and runs no package code.
  saltbox-prepare:
    needs: [plan, saltbox-gate]
    if: needs.saltbox-gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: prepare
        uses: ./.github/actions/update-saltbox-python
        with:
          mode: prepare
          sb-release: ${{ needs.plan.outputs.version }}
          uv-version: ${{ needs.saltbox-gate.outputs.uv-version }}
          directory: ${{ runner.temp }}/saltbox-update
      - uses: actions/upload-artifact@v7
        with:
          name: saltbox-update
          path: ${{ runner.temp }}/saltbox-update
          if-no-files-found: error
          include-hidden-files: true
          # A re-run of this job (after master moved) replaces it.
          overwrite: true

  # The App's token: contents write on saltyorg/Saltbox alone, as sb-go's
  # job asks for it. The App's variable and key reach this repository
  # through the `saltbox` environment, which the maintainer limits to the
  # release tags (or through the organisation's selected repositories), a
  # setting approved before the first stable release. publish.sh checks
  # the prepared files against master before it commits them.
  saltbox-commit:
    needs: [plan, saltbox-gate, saltbox-prepare]
    if: needs.saltbox-gate.outputs.run == 'true' && needs.saltbox-prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    environment: saltbox
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: saltbox-update
          path: ${{ runner.temp }}/saltbox-update
      - name: Create Saltbox toolchain update token
        id: saltbox-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.SALTBOX_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.SALTBOX_AUTOMATION_PRIVATE_KEY }}
          owner: saltyorg
          repositories: Saltbox
          permission-contents: write
      - name: Update supported Python toolchain for Saltbox
        uses: ./.github/actions/update-saltbox-python
        with:
          mode: commit
          token: ${{ steps.saltbox-token.outputs.token }}
          sb-release: ${{ needs.plan.outputs.version }}
          uv-version: ${{ needs.saltbox-gate.outputs.uv-version }}
          directory: ${{ runner.temp }}/saltbox-update
