# A release from a version tag (release spec, "Release channels"): the
# whole gate, the by-hand container suites, then each asset built with its
# version, commit and channel baked in, checked, and published with notes
# made from the commits; then, for a stable tag, the Discord announcement
# (release spec, "Release notes and announcement"). It writes nothing to Saltbox
# (ADR-031).
#
# Tags are bare semantic versions: `1.0.0` (stable) or `1.0.0-rc.N` (a
# prerelease). A stable tag publishes the plain `release` assets and the
# `_beta` ones, from the same code, so a beta host stays beta across
# stable releases; a prerelease publishes `_beta` assets only.
#
# A release tag is pushed by the maintainer, only for a commit whose CI
# passed; plan checks that again before anything is built.
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

# A release reads and writes no Actions cache: a cache entry another run
# saved could poison the published binaries. zizmor's cache-poisoning
# remediation: "disable caching entirely by setting `cache-mode: none`"
# (https://docs.zizmor.sh/audits/#cache-poisoning); GitHub's key:
# https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
# The setup actions' own caches are switched off below as well, so they
# don't even try.
cache-mode: none

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release reaches every host on its channel as root (`sb update`
  # self-updates without a question), so only a commit on main whose ci
  # run passed is released (the user rules: green CI on the exact commit
  # before a tag). The tag is semver without leading zeros, as semver
  # reads it.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Listing ci.yml's runs needs actions: read in a private repository:
    # https://docs.github.com/en/rest/actions/workflow-runs#list-workflow-runs-for-a-workflow
    permissions:
      contents: read
      actions: read # to list ci.yml's runs on the tagged commit
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      assets: ${{ steps.plan.outputs.assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The commit is on main and its ci passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          [[ $passed -gt 0 ]] || { echo "ci.yml has no successful run on $GITHUB_SHA" >&2; exit 1; }
      - id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          n='(0|[1-9][0-9]*)'
          [[ $TAG =~ ^$n\.$n\.$n(-rc\.$n)?$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          echo "version=$TAG" >>"$GITHUB_OUTPUT"
          if [[ $TAG == *-rc.* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
            echo 'assets=[{"arch":"amd64","channel":"beta"},{"arch":"arm64","channel":"beta"}]' >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
            echo 'assets=[{"arch":"amd64","channel":"release"},{"arch":"arm64","channel":"release"},{"arch":"amd64","channel":"beta"},{"arch":"arm64","channel":"beta"}]' >>"$GITHUB_OUTPUT"
          fi
      # The notes, from the commits since the previous release tag (a
      # stable release's previous stable one), made here so that a broken
      # history fails before the gate's hours.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release.sh notes "$TAG" "$GITHUB_REPOSITORY" >"$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # `check.sh full` with no base: every step, the production build's size,
  # its runs on each release and the aarch64 build under QEMU included.
  # On 26.04, whose image has the Docker 29 CONSTRAINTS.md's Tools table
  # asks for; the 22.04 and 24.04 images have Docker 28 (each image's
  # README: https://github.com/actions/runner-images/tree/main/images/ubuntu).
  # The binary's runs on 22.04 and 24.04 are the ubuntu:<release>
  # containers', so the job's own release doesn't matter to them.
  gate:
    name: "gate (check.sh full)"
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # `fallback: none` everywhere: a tool install-action has no
      # checksummed release for fails, never reaching cargo-binstall
      # unchecked (ci.yml; https://github.com/taiki-e/install-action/blob/v2.90.8/README.md, "Inputs").
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,hyperfine@2.0.0,zizmor@1.32.0,uv@0.13.4
          fallback: none
      # cross from crates.io, each crate checked against the index's
      # checksum, its dependencies at its own Cargo.lock: check.sh reads
      # cross's version from cargo's record only (running `cross --version`
      # syncs a toolchain), and install-action writes none.
      - name: cross
        run: cargo install --locked cross --version 0.2.5
      # check-jsonschema's Python (ci.yml); setup-python caches nothing
      # unless its `cache` input is set.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: gitleaks, diff-cover and check-jsonschema
        run: |
          scripts/install-gitleaks.sh "$RUNNER_TEMP/bin"
          scripts/install-diff-cover.sh "$RUNNER_TEMP/diff-cover" "$RUNNER_TEMP/bin"
          scripts/install-check-jsonschema.sh "$RUNNER_TEMP/check-jsonschema" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          rustup component add llvm-tools
      # GITHUB_ACTIONS through sudo too: check.sh full skips its CI
      # rehearsal here, where ci.yml runs itself. The root tests asked
      # for explicitly, as in ci.yml: check.sh refuses the ask in a run
      # that isn't root.
      - name: check.sh full
        env:
          SB_TEST_ROOT: "1"
        run: sudo --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME,GITHUB_ACTIONS,SB_TEST_ROOT env "PATH=$PATH" scripts/check.sh full

  # The test suite on arm64, natively (its full gate's x86_64-only steps
  # ran above).
  gate-arm64:
    name: "gate-arm64 / ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151,cargo-deny@0.20.2,hyperfine@2.0.0,zizmor@1.32.0,uv@0.13.4
          fallback: none
      # No aarch64 Linux build of cargo-mutants to install (ci.yml): built
      # from crates.io at its Cargo.lock.
      - name: cargo-mutants
        run: cargo install --locked cargo-mutants --version 27.1.0
      # check-jsonschema's Python (ci.yml); setup-python caches nothing
      # unless its `cache` input is set.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: gitleaks, diff-cover and check-jsonschema
        run: |
          scripts/install-gitleaks.sh "$RUNNER_TEMP/bin"
          scripts/install-diff-cover.sh "$RUNNER_TEMP/diff-cover" "$RUNNER_TEMP/bin"
          scripts/install-check-jsonschema.sh "$RUNNER_TEMP/check-jsonschema" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          rustup component add llvm-tools
      # The root tests asked for explicitly, as in ci.yml.
      - name: check.sh task
        env:
          SB_TEST_ROOT: "1"
        run: sudo --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME,SB_TEST_ROOT env "PATH=$PATH" scripts/check.sh task

  # The suites CONSTRAINTS.md and the specs run by hand at each checkpoint:
  # the completion shells, the journal matrix and, once a stable release
  # exists for its live --repair cases, the install-script containers.
  containers:
    name: container suites
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cross@0.2.5
          fallback: none
      - name: Completion shells
        run: |
          cargo build --locked -p sb
          crates/completion/tests/shells.sh
      - name: Journal matrix
        run: |
          bin=$(crates/journal/tests/example.sh)
          for release in 22.04 24.04 26.04; do
            SBJ_BIN=$bin crates/journal/tests/compare.sh "$release"
            SBJ_BIN=$bin crates/journal/tests/compat.sh 22.04 20.04 18.04 -- "$release"
            SBJ_BIN=$bin crates/journal/tests/follow.sh "$release"
            SBJ_BIN=$bin crates/journal/tests/stress.sh "$release"
          done
      # The token only for the probe, not for the build or the suite.
      - name: A stable release exists
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "no stable release yet: the --repair cases have nothing to fetch"
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Install-script containers
        if: steps.released.outputs.exists == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SB_VERSION=$TAG SB_GIT_COMMIT=${GITHUB_SHA::7} SB_CHANNEL=release \
            cargo build --locked --release -p sb
          SBI_SB=$PWD/target/release/sb install/tests/containers.sh

  build:
    name: "build / ${{ matrix.asset.arch }} ${{ matrix.asset.channel }}"
    needs: [plan, gate, gate-arm64, containers]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        asset: ${{ fromJSON(needs.plan.outputs.assets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cross@0.2.5
          fallback: none
      # Cross.toml passes SB_VERSION, SB_GIT_COMMIT and SB_CHANNEL into
      # cross's container (sb-M4).
      - name: Build
        env:
          SB_VERSION: ${{ needs.plan.outputs.version }}
          SB_CHANNEL: ${{ matrix.asset.channel }}
          ARCH: ${{ matrix.asset.arch }}
        run: |
          export SB_GIT_COMMIT=${GITHUB_SHA::7}
          target=x86_64-unknown-linux-gnu
          [[ $ARCH == arm64 ]] && target=aarch64-unknown-linux-gnu
          CARGO_TARGET_DIR=$PWD/target/cross-gnu cross build --locked -p sb --profile production --target "$target"
          name=sb_linux_${ARCH}
          [[ $SB_CHANNEL == beta ]] && name=${name}_beta
          mkdir -p dist
          cp "target/cross-gnu/$target/production/sb" "dist/$name"
          echo "ASSET=dist/$name" >>"$GITHUB_ENV"
      # The binary reports the tag's version, its own channel and a valid
      # uv_version: amd64 run directly, arm64 under QEMU user-mode.
      - name: Check
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ matrix.asset.channel }}
          ARCH: ${{ matrix.asset.arch }}
        run: |
          if [[ $ARCH == arm64 ]]; then
            sum=$(sha256sum build/qemu.Dockerfile)
            image="sb-rust-gate/qemu-check:${sum:0:12}"
            docker build --quiet --tag "$image" --file build/qemu.Dockerfile build
            json=$(docker run --rm --network none -e SB_LOG_DIR=/tmp/sb-log -v "$PWD/$ASSET:/sb:ro" \
              "$image" qemu-aarch64-static -L /usr/aarch64-linux-gnu /sb version --json)
          else
            json=$(SB_LOG_DIR=$RUNNER_TEMP/sb-log "$ASSET" version --json)
          fi
          printf '%s\n' "$json"
          jq -e --arg v "$VERSION" --arg c "$CHANNEL" \
            '.version == $v and .channel == $c and (.uv_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.asset.arch }}-${{ matrix.asset.channel }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # No environment and no required reviewer (sb-rust has none set up on
  # GitHub, the maintainer, 2026-11-25): pushing the version tag, which
  # the repository's tag ruleset restricts, is the decision to publish,
  # and plan above checks the tagged commit.
  publish:
    name: publish
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # to create the release and upload its assets
    steps:
      # Each artifact in a directory of its own name (merge-multiple off),
      # so a file of the same name in another `asset-*` artifact can't
      # replace a built one unseen:
      # https://github.com/actions/download-artifact#download-all-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: asset-*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # Exactly the plan's assets: each planned artifact holds its one
      # binary, a regular file, and an `asset-*` artifact another job of
      # the run uploaded is no asset. Then the binaries go to dist/.
      - name: The assets are the plan's
        env:
          ASSETS: ${{ needs.plan.outputs.assets }}
        run: |
          want=$(jq -r '.[] | "asset-\(.arch)-\(.channel)" as $a
            | $a, "\($a)/sb_linux_\(.arch)\(if .channel == "beta" then "_beta" else "" end)"' <<<"$ASSETS" | sort)
          got=$(find assets -mindepth 1 -printf '%P\n' | sort)
          files=$(find assets -mindepth 2 -type f -printf '%P\n' | sort)
          [[ $got == "$want" && $files == "$(grep / <<<"$want")" ]] ||
            { printf 'assets has:\n%s\nnot the plan'"'"'s:\n%s\n' "$got" "$want" >&2; exit 1; }
          mkdir dist
          mv assets/asset-*/sb_linux_* dist/
      # The action would create a missing tag on target_commitish; the
      # release is only ever the built commit's.
      - name: The tag still names the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          read -r type sha < <(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')
          if [[ $type == tag ]]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')
          fi
          [[ $sha == "$GITHUB_SHA" ]] || { echo "tag $TAG names $sha, not the built $GITHUB_SHA" >&2; exit 1; }
      # GitHub records each asset's sha256 digest, which self-update
      # requires (release spec, assumption 3); install.sh checks the pinned
      # URL, the ELF machine, the version and the channel instead.
      # As sb-go publishes, with softprops/action-gh-release and the notes
      # as the body: https://github.com/softprops/action-gh-release
      # make_latest `legacy`: GitHub marks the highest stable version
      # latest, so a backport (1.0.5 after 1.1.0) doesn't become
      # install.sh's; a prerelease is never latest:
      # https://docs.github.com/en/rest/releases/releases#create-a-release
      # zizmor's superfluous-actions asks for the runner's `gh` instead.
      # `gh release create --latest` sends make_latest "true" or "false"
      # only, so `legacy` would take `gh api` to create the release and
      # `gh release upload` for the assets: a rewrite of this step that
      # only a real release would test. The action stays, as sb-go
      # publishes, pinned to its commit.
      - name: Publish # zizmor: ignore[superfluous-actions] kept as sb-go publishes, see above
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.plan.outputs.version }}
          body_path: notes/release-notes.md
          draft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          make_latest: ${{ needs.plan.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          files: dist/*
          fail_on_unmatched_files: true

  # sb-go's "Notify Discord" step, as its own job: no write token, and a
  # failed post leaves the publication alone (re-run this job only). The
  # payload is built (and so checked) on every stable release; it is sent when
  # the DISCORD_WEBHOOK secret is set. The secret is a repository secret
  # (publish and announce use no environment, the maintainer,
  # 2026-11-25), read by this step alone; GitHub passes none to a fork's
  # pull request:
  # https://docs.github.com/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets
  # A prerelease (X.Y.Z-rc.N) is not announced (the maintainer, 2026-11-27).
  announce:
    name: announce on Discord
    needs: [plan, publish]
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      # The payload is built without the secret in reach; only the post
      # step has it.
      - name: Discord payload
        env:
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          scripts/release.sh discord "$TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/notes/release-notes.md" \
            "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >"$RUNNER_TEMP/discord.json"
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} # zizmor: ignore[secrets-outside-env] announce uses no environment; DISCORD_WEBHOOK is a repository secret (see the job's comment)
        run: |
          if [[ -z $DISCORD_WEBHOOK ]]; then
            echo "DISCORD_WEBHOOK isn't set: no announcement"
          else
            curl --fail-with-body --silent --show-error --proto =https --max-time 30 \
              -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/discord.json" "$DISCORD_WEBHOOK"
          fi
