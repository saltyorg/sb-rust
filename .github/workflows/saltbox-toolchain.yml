# The Saltbox toolchain updater's preflight, run by hand (release spec,
# "Saltbox's toolchain update"), as sb-go's test-gha.yml
# verify-toolchain-update job runs it: the newest published stable
# release, through the same gate the release uses, then the updater's
# prepare mode (sb-go's dry run), which writes nothing to Saltbox. A
# separate job checks that the App's credentials reach this repository and
# mint a read-only token, without the preflight's package code beside it.
#
# Written locally (2026-11-20) and not yet run: running workflows is a
# remote action the maintainer authorises separately.
name: saltbox-toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # A read-only token: it shows the key reaches Saltbox's installation,
  # with no write power (sb-go's minted contents write here).
  credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: saltbox
    steps:
      - name: Create scoped updater token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SALTBOX_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.SALTBOX_AUTOMATION_PRIVATE_KEY }}
          owner: saltyorg
          repositories: Saltbox
          permission-metadata: read

  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        name: The newest stable release, through the release's gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$RUNNER_TEMP/saltbox-gate
          mkdir -p "$dir"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/latest" >"$dir/release.json"; then
            echo "No stable release yet: nothing to preflight"
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(jq -r '.tag_name' "$dir/release.json")
          if jq -e 'any(.assets[]?; .name == "sb_linux_amd64")' "$dir/release.json" >/dev/null; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern sb_linux_amd64 --dir "$dir/bin"
            chmod 0755 "$dir/bin/sb_linux_amd64"
            env -u GH_TOKEN SB_LOG_DIR="$dir/sb-log" "$dir/bin/sb_linux_amd64" version --json >"$dir/version.json"
          fi
          gate=$(scripts/release.sh saltbox-gate "$tag" "$dir/release.json" "$dir/version.json")
          printf '%s\n' "$gate" | tee -a "$GITHUB_OUTPUT"
          # The gate passed only a stable tag, MAJOR.MINOR.PATCH.
          if [[ $gate == run=true* ]]; then echo "release=$tag" >>"$GITHUB_OUTPUT"; fi
      - name: Preflight the updater without publishing
        if: steps.gate.outputs.run == 'true'
        uses: $/.github/actions/update-saltbox-python
        with:
          mode: prepare
          sb-release: ${{ steps.gate.outputs.release }}
          uv-version: ${{ steps.gate.outputs.uv-version }}
          directory: ${{ runner.temp }}/saltbox-update
