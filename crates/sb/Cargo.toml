[package]
name = "sb"
version = "0.1.0"
description = "The Saltbox CLI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sb-cli-core.workspace = true
sb-host.workspace = true
sb-term-ui.workspace = true
sb-docker.workspace = true
sb-config.workspace = true
# `sb edit`'s editor, attached to the terminal (tui spec, editors).
sb-exec.workspace = true
# `sb motd` (motd spec).
sb-motd.workspace = true
# `sb diag` (and later `install` and `list`): playbooks by tag (ansible spec).
sb-ansible.workspace = true
shlex.workspace = true
# `sb self-update` (release spec).
sb-release.workspace = true
# `sb logs`: the picker and the viewer (tui spec; ADR-023).
sb-tui.workspace = true
# The start of a Saltbox backup sb waits for, in the local zone (main.rs).
jiff.workspace = true
# `sb update-venv` (python-env spec).
sb-python-env.workspace = true
# The hidden `sb announcements` (ops spec), and later the other workflow
# commands.
sb-ops.workspace = true
# Tab completion and `sb completion` (completion spec).
sb-completion.workspace = true
anyhow.workspace = true
# `net` for the I/O driver bollard's sockets need (enable_all turns on
# only what is compiled in).
tokio = { workspace = true, features = ["net"] }
anstream.workspace = true
clap.workspace = true
colorchoice-clap.workspace = true
tracing.workspace = true

[dev-dependencies]
sb-docker = { workspace = true, features = ["testing"] }
sb-config = { workspace = true, features = ["testing"] }
# The fake GitHub, and the test build's `SB_RELEASE_TEST_BASES` (never in
# a release or production build: scripts/check.sh checks sb's normal
# tree has no `testing` feature of sb-release).
sb-release = { workspace = true, features = ["testing"] }
# The stand-in Saltbox tree and the test build's `SB_TEST_PYTHON_ENV_ROOT`
# (never in a release or production build: the same check as
# sb-release's).
sb-python-env = { workspace = true, features = ["testing"] }
# The ops harness: stand-in apt, locale and bash, the private mount
# namespace `sb gha` runs in, the fake restore service `sb restore`'s
# tests run against, and bench's network fakes and the test build's
# `SB_BENCH_TEST_NETWORK` (never in a release or production build).
sb-ops = { workspace = true, features = ["testing"] }
# The test build's `SB_TEST_COMPLETION_ROOT`, where `sb completion install`
# writes in tests (never in a release or production build).
sb-completion = { workspace = true, features = ["testing"] }
# The test build's `SB_TEST_RUN_LOCK_DIR`, the run lock's directory in
# tests (never in a release or production build).
sb-cli-core = { workspace = true, features = ["testing"] }
# The Speedtest archive the fake release serves (bench's tests).
tar.workspace = true
flate2.workspace = true
insta.workspace = true
serde_json.workspace = true
console.workspace = true
rustix.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
# The fake release's digest (self-update's tests).
sha2.workspace = true
hex.workspace = true
# `sb logs` end to end: crafted journal files in `SB_JOURNAL_DIR`
# (sb-journal's, through sb-host: deny.toml lets only sb-host wrap the
# reader), the screen on a PTY read through vt100 (tui spec, Testing
# Strategy).
sb-host = { workspace = true, features = ["testing"] }
portable-pty.workspace = true
vt100.workspace = true
# tests/entropy.rs: aws-lc built without CPU-jitter entropy (ADR-027),
# asked of aws-lc-rs and read from the test binary's symbols.
aws-lc-rs.workspace = true
object.workspace = true

[lints]
workspace = true
