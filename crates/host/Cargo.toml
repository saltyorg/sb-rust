[package]
name = "sb-host"
version = "0.1.0"
description = "The host sb runs on: started with the supported-release check (capability map, host)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The program-path and timeout setters for tests outside the crate
# (M-TEST-UTIL); never in a release build.
testing = []

[dependencies]
sysinfo.workspace = true
thiserror.workspace = true
# apt's step errors, with sb-go's texts as context over exec's.
anyhow.workspace = true
# add_repositories' atomic saves (host spec, Tech Stack).
tempfile.workspace = true
# The journal reader, which sb-host wraps (host spec, decision 6).
sb-journal.workspace = true
# The systemd-coredump user's uid for `Query::unit`, and the ownership
# user's ids (host spec, decision 2).
nix.workspace = true
# The recursive ownership walk (host spec, decision 2 and assumption 3).
walkdir.workspace = true
# The run log's records (the ownership counts).
tracing.workspace = true
# systemctl's captures for the service list (host spec, assumption 1), and
# the caller's token that ends them.
sb-exec.workspace = true
tokio-util.workspace = true
# The caller's step that apt's install, remove and update stream into
# (host spec, Tech Stack).
sb-term-ui.workspace = true
# systemctl's JSON tables and the service times (host spec, Tech Stack).
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
# `spawn_blocking` for the journal's blocking reads (journal spec,
# assumption 3): the workspace entry (`rt`, `time`); `macros` for the
# service list's `join!`.
tokio = { workspace = true, features = ["macros"] }
# The follow's wake wait (`journal::FollowWait`): `event`'s `poll` on the
# wake descriptor and a stop `eventfd`, under `spawn_blocking`, in place
# of tokio's `AsyncFd` (journal spec, decision 12).
rustix = { workspace = true, features = ["event"] }

[dev-dependencies]
# The crafted journal files the helpers' tests page and follow.
sb-journal = { workspace = true, features = ["testing"] }
# `#[tokio::test]`'s current-thread runtime.
tokio = { workspace = true, features = ["macros", "sync"] }
# apt's steps drawn to memory, and the runner's shutdown for Ctrl-C.
sb-term-ui = { workspace = true, features = ["testing"] }
sb-cli-core.workspace = true
indicatif.workspace = true
# The run log test's capture.
tracing-subscriber.workspace = true

[lints]
workspace = true
