[package]
name = "sb-host"
version = "0.1.0"
description = "The host sb runs on: started with the supported-release check (capability map, host)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sysinfo.workspace = true
thiserror.workspace = true
# The journal reader, which sb-host wraps (host spec, decision 6).
sb-journal.workspace = true
# The systemd-coredump user's uid for `Query::unit`, and the ownership
# user's ids (host spec, decision 2).
nix.workspace = true
# The recursive ownership walk (host spec, decision 2 and assumption 3).
walkdir.workspace = true
# The run log's records (the ownership counts).
tracing.workspace = true
# `spawn_blocking` for the journal's blocking reads (journal spec,
# assumption 3): the workspace entry (`rt`, `time`); only `rt` is used.
tokio.workspace = true
# The follow's wake wait (`journal::FollowWait`): `event`'s `poll` on the
# wake descriptor and a stop `eventfd`, under `spawn_blocking`, in place
# of tokio's `AsyncFd` (journal spec, decision 12).
rustix = { workspace = true, features = ["event"] }

[dev-dependencies]
# The crafted journal files the helpers' tests page and follow.
sb-journal = { workspace = true, features = ["testing"] }
# `#[tokio::test]`'s current-thread runtime.
tokio = { workspace = true, features = ["macros"] }
tempfile.workspace = true
# The run log test's capture.
tracing-subscriber.workspace = true

[lints]
workspace = true
