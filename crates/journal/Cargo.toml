[package]
name = "sb-journal"
version = "0.1.0"
description = "sb's own read-only systemd journal reader, pread only and pure Rust (journal spec; wrapped by sb-host)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test support (the repository's convention, as in sb-docker): the
# crafted-file builder, the tools' file-level access, the injectable roots
# and the opener's counts, the JSON form and the tools' verdicts (journal
# spec, Project Structure), and the comparison CLI's argument parsing.
# Turned on for every test build by the self dev-dependency below
# (dev-dependency features unify), never in a release or production build.
# rustix's `event` gives the tools and tests `poll`, their wait on a
# follow's wake descriptor (the crate itself waits on nothing).
testing = ["dep:tempfile", "dep:serde_json", "dep:clap", "rustix/event"]

[dependencies]
siphasher.workspace = true
lz4_flex.workspace = true
ruzstd.workspace = true
lzma-rust2.workspace = true
hex.workspace = true
thiserror.workspace = true
itertools.workspace = true
# A record's time (`Record::realtime`).
jiff.workspace = true
# Opening files safely: the `O_*` flag values for std's `custom_flags`
# (security audit L2; open.rs).
rustix.workspace = true
# The crafted-file builder writes its files to temporary files.
tempfile = { workspace = true, optional = true }
# The tools' JSON form, journalctl's `-o json` (`testing::tools::json`).
serde_json = { workspace = true, optional = true }
# The comparison CLI's arguments (examples/journal.rs).
clap = { workspace = true, optional = true }

[dev-dependencies]
# Turns `testing` on for the unit tests and every other test target
# (plan, "Code with no user yet").
sb-journal = { workspace = true, features = ["testing"] }
tempfile.workspace = true
crc32fast.workspace = true
# The comparison CLI's errors (examples/journal.rs; plan, "Typed errors":
# anyhow only in the examples).
anyhow.workspace = true

# The comparison CLI the container scripts run (crates/journal/tests/):
# a thin wrapper over `testing::tools`. `test = true` runs its argument
# check under `cargo test`.
[[example]]
name = "journal"
required-features = ["testing"]
test = true

[lints]
workspace = true
