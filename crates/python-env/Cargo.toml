[package]
name = "sb-python-env"
version = "0.1.0"
description = "The uv-managed Python and the Ansible venv Saltbox runs (capability map, python-env)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Stand-in uv, python and entry-point programs, a Saltbox tree on a
# temporary root and sb-release's fake GitHub (`testing` module), for
# sb-python-env's tests and sb's end-to-end tests: built into the sb that `cargo test` runs (resolver 3
# unifies dev-dependency features only for test builds), never into a
# release or production build.
testing = ["dep:sha2", "sb-host/testing", "sb-release/testing"]

[dependencies]
# Every uv, Python, entry-point and git child (python-env spec,
# assumption 4 and decision 11).
sb-exec.workspace = true
# A failed child's one-line text (sb-host's `child_failure`); later its
# apt and ownership calls (spec, steps 3 and 16).
sb-host.workspace = true
# The caller's steps the reconcile runs in (spec, assumption 4).
sb-term-ui.workspace = true
# A nested step's quiet exit (`Exit`), passed up.
sb-cli-core.workspace = true
# The streamed lock digest (release spec amendment R8); uv's release
# metadata, verified download and activation (R1-R6).
sb-release.workspace = true
# uv's archive (spec, step 2; decision 13).
tar.workspace = true
flate2.workspace = true
# The manifest (spec, step 11; decision 7).
serde.workspace = true
serde_json.workspace = true
# Step bodies' errors, with sb-go's texts as context.
anyhow.workspace = true
# The run log's records (why a venv is unhealthy).
tracing.workspace = true
# `spawn_blocking` for the ownership walk.
tokio.workspace = true
# Generation and Python release names, the manifest's `created_at`
# (spec, Tech Stack).
jiff.workspace = true
# The uv minimum (decision 14).
semver.workspace = true
hex.workspace = true
# The scratch TMPDIR of each child (spec, "Child isolation").
tempfile.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
# The fake release's digests (`testing` only).
sha2 = { workspace = true, optional = true }

[dev-dependencies]
# Itself with `testing`, for the stand-in programs its tests run (as
# sb-repo's tests take its own `testing`).
sb-python-env = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "sync"] }
# The steps drawn to memory, and the runner's shutdown.
sb-term-ui = { workspace = true, features = ["testing"] }
indicatif.workspace = true
# The lock digest's test compares with sha2's own.
sha2.workspace = true

[lints]
workspace = true
