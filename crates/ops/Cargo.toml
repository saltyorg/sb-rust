[package]
name = "sb-ops"
version = "0.1.0"
description = "Saltbox's workflow commands: update, the branch commands, announcements, setup, restore, bench, gha (capability map, ops)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The stand-in programs and temporary root setup's and gha's shared pieces
# run against, and the Saltbox host update and the branch commands run on
# (python-env's stand-in tree, sb-config's fixtures and fake), in the
# `testing` module, for sb-ops' tests and sb's: never in a release build.
testing = ["sb-host/testing", "sb-python-env/testing", "sb-config/testing", "dep:axum", "dep:futures-util", "tokio/net", "tokio/rt", "tokio/sync"]

[dependencies]
sb-cli-core.workspace = true
# announcements.yml through Saltbox's YAML entry (ops spec, "Announcements";
# ADR-022): the pre-pass and loader, yaml.v3's scalar resolution, issues
# with their positions.
sb-config.workspace = true
# The loaded file's nodes, walked as yaml.v3 decodes into sb-go's types.
saphyr.workspace = true
# `sb announcements`' runner step (term-ui).
sb-term-ui.workspace = true
# The branch commands' fetch and reset of Saltbox's checkouts (ops spec,
# "`sb branch <name>` and `sb branch-sandbox <name>`").
sb-repo.workspace = true
# setup's and gha's apt sequence and sources (ops spec, assumption 4: host's
# apt, `add_repositories`).
sb-host.workspace = true
# The locale programs and the git hooks script (every child through exec).
sb-exec.workspace = true
# gha's venv and saltbox.fact (ops spec, assumption 4: python-env's
# `reconcile_venv` and `install_fact`).
sb-python-env.workspace = true
# update's self-update step: release's flow with the answer given (ops
# spec, "`sb update`", step 3).
sb-release.workspace = true
# The tags caches after each pull and the migrations' playbook runs (ops
# spec, "`sb update`", steps 7, 9 and 10; the branch commands, step 5).
sb-ansible.workspace = true
# The config files' handles: opened without following a link, `fstat`ed
# (ops spec, `secure_existing_configs`).
rustix.workspace = true
# The announcements' inline Markdown form and their viewer (tui spec,
# Scope and "The announcement viewer").
sb-tui.workspace = true
# The heading's date (ops spec, Project Structure).
jiff.workspace = true
# `sb announcements`' flags, as sb-ansible's carry install's.
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
# restore's crypto (ops spec, "Decryption"): OpenSSL's enc format, the
# user key, and buffers cleared on drop. Each crate's `zeroize` feature
# clears its own state too: AES's key schedule, CBC's IV, the hash cores
# over the password and the user name. hmac 0.13's padded key block and
# PBKDF2's intermediate blocks are stack temporaries no feature clears
# (best effort; ops spec, Known limits).
aes = { workspace = true, features = ["zeroize"] }
cbc = { workspace = true, features = ["zeroize"] }
pbkdf2.workspace = true
sha1 = { workspace = true, features = ["zeroize"] }
sha2 = { workspace = true, features = ["zeroize"] }
zeroize.workspace = true
# The user key's hex (stack table "Versions"; already in the tree).
hex.workspace = true
# restore's placement: a temporary file in the root, persisted over the
# destination (ops spec, "Placement"); the `testing` harness's temporary
# root too.
tempfile.workspace = true
# restore's fetch (ops spec, "Protocol"): one client, no redirects; tokio's
# `select!` stops it on a first signal.
reqwest.workspace = true
# The body's cap: `Limited` fails a byte past it.
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros"] }
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Itself with `testing`, for the harness its tests run (as sb-python-env's).
sb-ops = { workspace = true, features = ["testing"] }
# Saltbox's pinned schemas and config fixtures, and the credential
# checks' fake, for update's validation in process.
sb-config = { workspace = true, features = ["testing"] }
# release's fake GitHub, for update's self-update in process.
sb-release = { workspace = true, features = ["testing"] }
# The fake release's asset digest, as release's tests give it.
sha2.workspace = true
hex.workspace = true
# python-env's stand-in tree and fake GitHub, for gha's in-process tests.
sb-python-env = { workspace = true, features = ["testing"] }
# The steps drawn to memory, and the runner's shutdown.
sb-term-ui = { workspace = true, features = ["testing"] }
indicatif.workspace = true
# The async tests (gha's, restore's command).
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
