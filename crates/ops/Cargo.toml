[package]
name = "sb-ops"
version = "0.1.0"
description = "Saltbox's workflow commands: update, the branch commands, announcements, setup, restore, bench, gha (capability map, ops)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The stand-in programs and temporary root setup's and gha's shared pieces
# The stand-in programs and temporary root setup's and gha's shared pieces
# run against, the Saltbox host update and the branch commands run on
# (python-env's stand-in tree, sb-config's fixtures and fake), the fake
# restore service, and bench's network fakes, in the `testing` module,
# for sb-ops' tests and sb's end-to-end tests: built into the sb that
# `cargo test` runs (dev-dependency features unify), never into a release
# or production build, where bench asks the real services.
testing = ["sb-host/testing", "sb-python-env/testing", "sb-config/testing", "dep:axum", "dep:futures-util", "sb-release/testing", "tokio/net", "tokio/rt", "tokio/sync"]

[dependencies]
sb-cli-core.workspace = true
# announcements.yml through Saltbox's YAML entry (ops spec, "Announcements";
# ADR-022): the pre-pass and loader, yaml.v3's scalar resolution, issues
# with their positions.
sb-config.workspace = true
# The loaded file's nodes, walked as yaml.v3 decodes into sb-go's types.
saphyr.workspace = true
# `sb announcements`' runner step (term-ui).
sb-term-ui.workspace = true
# The branch commands' fetch and reset of Saltbox's checkouts (ops spec,
# "`sb branch <name>` and `sb branch-sandbox <name>`").
sb-repo.workspace = true
# setup's and gha's apt sequence and sources (ops spec, assumption 4: host's
# apt, `add_repositories`), and bench's free-space rule for the disk test
# (host's `free_space`).
sb-host.workspace = true
# The locale programs, the git hooks script and bench's
# `systemd-detect-virt` (every child through exec).
sb-exec.workspace = true
# gha's venv and saltbox.fact (ops spec, assumption 4: python-env's
# `reconcile_venv` and `install_fact`).
sb-python-env.workspace = true
# update's self-update step: release's flow with the answer given (ops
# spec, "`sb update`", step 3); bench's Speedtest: release's verified
# download of the pinned archive and its ELF check (ops spec, decision
# 13; release spec, "bench").
sb-release.workspace = true
# The tags caches after each pull and the migrations' playbook runs (ops
# spec, "`sb update`", steps 7, 9 and 10; the branch commands, step 5).
sb-ansible.workspace = true
# update's and setup's completion refresh (ops spec, update step 12 and
# setup step 4; completion's `refresh_with`).
sb-completion.workspace = true
# The config files' handles: opened without following a link, `fstat`ed
# (ops spec, `secure_existing_configs`); bench's stat and statvfs of df's
# filesystems (f_bfree, which sysinfo lacks).
rustix.workspace = true
# The announcements' inline Markdown form and their viewer (tui spec,
# Scope and "The announcement viewer").
sb-tui.workspace = true
# The heading's date (ops spec, Project Structure).
jiff.workspace = true
# The commands' flags (setup's, update's, the branch commands'), as sb-ansible's carry install's.
clap.workspace = true
# bench's uptime, load, kernel, arch and ARM CPU name (ops spec, "`sb
# bench`").
sysinfo.workspace = true
# bench's /proc/cpuinfo, /proc/meminfo and mounts, parsed as motd's rows are.
procfs.workspace = true
# The archive's one `speedtest` entry (capability map, "Archives";
# python-env uses them too).
tar.workspace = true
flate2.workspace = true
# bench's icanhazip and ipinfo answers and the Speedtest CLI's JSON.
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
# restore's crypto (ops spec, "Decryption"): OpenSSL's enc format, the
# user key, and buffers cleared on drop. Each crate's `zeroize` feature
# clears its own state too: AES's key schedule, CBC's IV, the hash cores
# over the password and the user name. hmac 0.13's padded key block and
# PBKDF2's intermediate blocks are stack temporaries no feature clears
# (best effort; ops spec, Known limits).
aes = { workspace = true, features = ["zeroize"] }
cbc = { workspace = true, features = ["zeroize"] }
pbkdf2.workspace = true
sha1 = { workspace = true, features = ["zeroize"] }
sha2 = { workspace = true, features = ["zeroize"] }
zeroize.workspace = true
# The user key's hex (stack table "Versions"; already in the tree), and
# bench's Speedtest pin digest.
hex.workspace = true
# restore's placement: a temporary file in the root, persisted over the
# destination (ops spec, "Placement"); the `testing` harness's temporary
# root too; bench's disk test file: 0600, created exclusively, removed on
# drop (ops spec, "`sb bench`", 2.).
tempfile.workspace = true
# restore's fetch (ops spec, "Protocol"): one client, no redirects; tokio's
# `select!` stops it on a first signal. bench's icanhazip and ipinfo.
reqwest.workspace = true
# X25519MLKEM768 offered first (ADR-027's amendment): reqwest's rustls
# leaves the feature off.
rustls = { workspace = true, features = ["prefer-post-quantum"] }
# The body's cap: `Limited` fails a byte past it.
http-body-util.workspace = true
# restore's `select!`, and bench's time limits on the blocking pool's work.
tokio = { workspace = true, features = ["macros", "time"] }
# The fakes (`testing`): restore's service and bench's network.
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Itself with `testing`, for the harness its tests run (as sb-python-env's).
sb-ops = { workspace = true, features = ["testing"] }
# Saltbox's pinned schemas and config fixtures, and the credential
# checks' fake, for update's validation in process.
sb-config = { workspace = true, features = ["testing"] }
# release's fake GitHub, for update's self-update in process, and its
# TLS fake and stand-in ELF for bench's Speedtest tests.
sb-release = { workspace = true, features = ["testing"] }
# The fake release's asset digest, as release's tests give it.
sha2.workspace = true
hex.workspace = true
# python-env's stand-in tree and fake GitHub, for gha's in-process tests.
sb-python-env = { workspace = true, features = ["testing"] }
# The steps drawn to memory, and the runner's shutdown.
sb-term-ui = { workspace = true, features = ["testing"] }
indicatif.workspace = true
# The async tests (gha's, restore's command, bench's), and bench's
# network fakes on loopback.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
axum.workspace = true
# bench's report snapshots, as sb list's.
insta.workspace = true

[lints]
workspace = true
