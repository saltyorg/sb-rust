[package]
name = "sb-release"
version = "0.1.0"
description = "GitHub releases for sb: lookup through the SVM proxy, checked assets, verified downloads and sb self-update (capability map, release)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake proxy, GitHub API and download host on a loopback TLS port
# (`testing` module) for sb-release's tests and sb's end-to-end tests: built
# into the sb that `cargo test` runs (resolver 3 unifies dev-dependency
# features only for test builds), never into a release or production build.
testing = ["dep:axum", "dep:futures-util", "dep:rcgen", "dep:tokio-rustls", "tokio/macros", "tokio/net", "tokio/rt", "tokio/sync"]

[dependencies]
sb-cli-core.workspace = true
anyhow.workspace = true
sb-term-ui.workspace = true
# The staged binary's `version --json` (release spec, step 4).
sb-exec.workspace = true
hex.workspace = true
jiff.workspace = true
object.workspace = true
reqwest.workspace = true
# X25519MLKEM768 offered first (ADR-027's amendment): reqwest's rustls
# leaves the feature off.
rustls = { workspace = true, features = ["prefer-post-quantum"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The file digests on a CPU without SHA instructions (asset.rs,
# `sha256_reader`): already in sb as rustls's crypto.
aws-lc-rs.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
tracing.workspace = true
axum = { workspace = true, optional = true }
# The fake's bodies sent in parts, with pauses (a slow or stalled server).
futures-util = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
# Turns `testing` on for the unit tests and every other test target (as
# sb-journal does).
sb-release = { workspace = true, features = ["testing"] }
hex.workspace = true
sb-term-ui = { workspace = true, features = ["testing"] }
indicatif.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
# The failed-write test's child lifts its file-size limit before it ends
# (`setrlimit`), so its coverage profile is written whole.
rustix.workspace = true

[lints]
workspace = true
