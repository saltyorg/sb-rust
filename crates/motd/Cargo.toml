[package]
name = "sb-motd"
version = "0.1.0"
description = "sb motd: the login's system, media-server and downloader status, collected in parallel (capability map, motd)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The run log's paths and file reads, and the theme's roles.
sb-cli-core.workspace = true
# `paint` for the keys and `DisplayText` for text sb didn't write.
sb-term-ui.workspace = true
# /proc's uptime, loadavg, cpuinfo, meminfo and process list (motd spec,
# Tech Stack; decision 16).
procfs.workspace = true
# CPU's model without sb-go's ` N-Core` tail (sb-go's own pattern).
regex.workspace = true
# `uname(2)` for Kernel, `statvfs(3)` and `stat(2)` for Disk Usage (motd
# spec, Sections; decision 16).
rustix = { workspace = true, features = ["fs", "system"] }
# loginctl's session list and Traefik's routers (motd spec, Tech Stack),
# and `--generate-config`'s schema examples, as sb-config keeps them.
serde.workspace = true
serde_json.workspace = true
# Docker and Traefik: the run's one container listing and its roles
# (motd decision 13).
sb-docker.workspace = true
# Traefik's answer read through the 1 MiB body cap, its errors' chain;
# motd.yml's one check (`check_file`), its tree and its schema (motd
# decisions 17 and 18).
sb-config.workspace = true
# motd.yml's colours as cli-core resolves them (motd decision 5).
anstyle.workspace = true
# Go's `unicode.IsPrint` for `--generate-config`'s quoting: the general
# category groups (letters, marks, numbers, punctuation, symbols).
icu_properties.workspace = true
# Traefik's routers (motd decision 15).
reqwest.workspace = true
# rTorrent's XML-RPC: the `methodCall` written, the `methodResponse` read
# (motd spec, Tech Stack).
quick-xml.workspace = true
# qBittorrent's login form (application/x-www-form-urlencoded).
form_urlencoded.workspace = true
# `--banner-file-toilet`'s arguments split as shell words (motd decision
# 22; stack table "Shell quoting").
shlex.workspace = true
# Every child: update-notifier's scripts, apt, loginctl and last
# (CONSTRAINTS.md).
sb-exec.workspace = true
thiserror.workspace = true
# Services: the systemd service list and its duration texts (motd
# decision 14), and the time they are measured at.
sb-host.workspace = true
jiff.workspace = true
# The sections' tasks and the 30 s cap (motd decision 11).
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The token sb-exec's `capture` takes.
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# Docker's fake Engine API and Traefik's fake server (motd spec, Testing).
sb-docker = { workspace = true, features = ["testing"] }
sb-config = { workspace = true, features = ["testing"] }
# systemctl pointed at a stand-in (`Systemd::with_program`).
sb-host = { workspace = true, features = ["testing"] }
# The runner's tests on tokio's paused clock (motd spec, Testing); `net`
# for the held refused port of docker.rs's tests.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "test-util", "time"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
# The Certificates line's forms (motd spec, Testing).
insta.workspace = true

[lints]
workspace = true
