[package]
name = "sb-ansible"
version = "0.1.0"
description = "Playbook runs by tag, the tag listing and its cache: sb install, list and diag (capability map, ansible)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sb-cli-core.workspace = true
# Every playbook run (ansible spec, assumption 2).
sb-exec.workspace = true
thiserror.workspace = true
# install's flags (`Count`, `Append`, `allow_hyphen_values`).
clap.workspace = true
# The tag cache (M32): the rebuild's step, the HEAD commit that validates
# an entry (repo spec, `head`), sb-go's cache.json read and written whole
# and atomically, the `TASK TAGS:` match.
sb-term-ui.workspace = true
sb-repo.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
regex.workspace = true
tokio-util.workspace = true
# sb list reads Saltbox's and Sandbox's HEADs at once (`join!`; sb-exec
# has the feature on already).
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
# The rebuild step's body result (term-ui's `Step::step`).
anyhow.workspace = true
# Whether Saltbox's and Sandbox's tag listings run at once: one per
# physical core sb may run on (host's `cores`; spec, decision 22).
sb-host.workspace = true
# install's suggestions: Levenshtein distance per Unicode scalar, as
# sb-go's agnivade/levenshtein (spec, step 5; plan decision 8).
strsim.workspace = true
# sb list's columns, as many as the width holds (spec, decision 16).
uutils_term_grid.workspace = true
# The tags' display width, to pad each to the one column width every
# repository shares (spec, decision 19); cli-core's help measures so.
unicode-width.workspace = true

[dev-dependencies]
# sb list's outputs as snapshots (spec, Testing strategy).
insta.workspace = true
# A real Shutdown and runtime for the attached runs, with the fake
# playbook (tests/fixtures/fake-ansible-playbook).
tokio = { workspace = true, features = ["macros", "time"] }
# The rebuild's step on a runner drawing to memory, as sb-repo's tests.
sb-term-ui = { workspace = true, features = ["testing"] }
indicatif.workspace = true
# The corrupt cache's log record, captured.
tracing-subscriber.workspace = true

[lints]
workspace = true
