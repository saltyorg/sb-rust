[package]
name = "sb-tui"
version = "0.1.0"
description = "sb's full-screen screens: the log picker and viewer, the editors (capability map, tui)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake source task for the viewer's tests (`testing`); never in a
# release build.
testing = []

[dependencies]
sb-cli-core.workspace = true
# The service list and status times, and the journal reader's API the
# journal adapter pages and follows on (tui spec, Sources).
sb-host.workspace = true
# The container list, its picker status, log reads and events the docker
# adapter and the Containers section use (tui spec, "Sources").
sb-docker.workspace = true
# sb-docker's errors, as it gives them.
anyhow.workspace = true
# Line times and the status rule's durations (tui spec, Tech Stack).
jiff.workspace = true
# The run log's records: pages, follows, read errors (tui spec, "The run
# log").
tracing.workspace = true
ratatui.workspace = true
# The palette and log spans (M67): added with the groundwork, as the tui
# spec's slice 0 lists it.
ratatui-core.workspace = true
crossterm.workspace = true
# SGR in log text (M67), likewise.
ansi-to-tui.workspace = true
# Announcements' Markdown, the inline form (tui spec, Scope; ops spec,
# "Shown"), with syntect's code highlighting (CONSTRAINTS.md E1).
tui-markdown.workspace = true
# The picker's name filter line (tui spec, "The picker", Keys).
ratatui-textarea.workspace = true
# `DisplayText`, the one way untrusted bytes reach the screen (journal
# spec, "Display").
sb-term-ui.workspace = true
# Log spans' colours brought down to the run's profile, as the palette's
# (ADR-002), through ratatui-core's `anstyle` conversions.
anstyle.workspace = true
anstyle-lossy.workspace = true
futures-util.workspace = true
# The event loop's channel and `select!` (tui spec, Tech Stack).
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true
# The soft RLIMIT_NOFILE the logs commands raise (`setrlimit`), and the
# errno of a follow stopped by an inotify limit (tui spec, Tech Stack).
rustix.workspace = true

[dev-dependencies]
sb-cli-core.workspace = true
# The viewer's `TestBackend` snapshots (tui spec, Testing Strategy).
insta.workspace = true
# The crafted journal files the journal adapter pages and follows (tui
# spec, Testing Strategy): sb-journal's, through sb-host, the reader's
# one wrapper (deny.toml), now that sb's graph holds sb-tui.
sb-host = { workspace = true, features = ["testing"] }
# The fake Engine API the docker adapter and the Containers section run
# against (tui spec, Testing Strategy).
sb-docker = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "test-util"] }
portable-pty.workspace = true
vt100.workspace = true
tempfile.workspace = true
tracing.workspace = true
# The refresh's run-log test reads tracing's records back (as sb-exec's).
tracing-subscriber.workspace = true

[lints]
workspace = true
