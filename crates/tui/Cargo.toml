[package]
name = "sb-tui"
version = "0.1.0"
description = "sb's full-screen screens: the log picker and viewer, the editors (capability map, tui)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake source task for the viewer's tests (`testing`); never in a
# release build.
testing = []

[dependencies]
sb-cli-core.workspace = true
# The service list and status times, and the journal reader's API the
# journal adapter pages and follows on (tui spec, Sources).
sb-host.workspace = true
# Line times and the status rule's durations (tui spec, Tech Stack).
jiff.workspace = true
# The run log's records: pages, follows, read errors (tui spec, "The run
# log").
tracing.workspace = true
ratatui.workspace = true
# The palette and log spans (M67): added with the groundwork, as the tui
# spec's slice 0 lists it.
ratatui-core.workspace = true
crossterm.workspace = true
# SGR in log text (M67), likewise.
ansi-to-tui.workspace = true
# `DisplayText`, the one way untrusted bytes reach the screen (journal
# spec, "Display").
sb-term-ui.workspace = true
# Log spans' colours brought down to the run's profile, as the palette's
# (ADR-002), through ratatui-core's `anstyle` conversions.
anstyle.workspace = true
anstyle-lossy.workspace = true
futures-util.workspace = true
# The event loop's channel and `select!` (tui spec, Tech Stack).
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true

[dev-dependencies]
sb-cli-core.workspace = true
# The viewer's `TestBackend` snapshots (tui spec, Testing Strategy).
insta.workspace = true
# The crafted journal files the journal adapter pages and follows (tui
# spec, Testing Strategy).
sb-journal = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["sync", "macros", "test-util"] }
portable-pty.workspace = true
vt100.workspace = true
rustix.workspace = true
tempfile.workspace = true
tracing.workspace = true

[lints]
workspace = true
