[package]
name = "sb-cli-core"
version = "0.1.0"
description = "How sb starts, runs a command and ends: the frame every sb-rust command runs in"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
anstyle.workspace = true
anstyle-lossy.workspace = true
colorchoice-clap.workspace = true
clap_lex.workspace = true
serde.workspace = true
serde_json.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
toml.workspace = true
thiserror.workspace = true
signal-hook.workspace = true
tokio-util.workspace = true
# The blocking pool, for spawn.rs's helper that carries the caller's span.
tokio.workspace = true
rustix.workspace = true
# The run lock's ancestor walk (run_lock.rs): each process's parent pid.
procfs.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
# Help lines wrapped at words (help.rs), the wrap term-ui uses.
tabled.workspace = true
# A combining mark stays with its base character in escaped text
# (plan decision 40).
icu_properties.workspace = true

[features]
# The run lock's directory under a test's (`run_lock::DIR_VAR`), for sb's
# tests; never in a release build.
testing = []

[dev-dependencies]
anstream.workspace = true
tempfile.workspace = true

[lints]
workspace = true
