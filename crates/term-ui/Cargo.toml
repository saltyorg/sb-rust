[package]
name = "sb-term-ui"
version = "0.1.0"
description = "sb's inline terminal output: colour on every path, the task runner and tables (capability map, term-ui)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The in-memory screen for snapshot tests (pulls vt100), and the live
# block's test screen on vt100 itself; never in sb.
testing = ["indicatif/in_memory", "dep:vt100"]

[dependencies]
sb-cli-core.workspace = true
anyhow.workspace = true
anstream.workspace = true
indicatif.workspace = true
rustix.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
anstyle.workspace = true
anstyle-parse.workspace = true
console.workspace = true
dialoguer.workspace = true
# The alternate screen a question during a run opens on (`confirm_over`,
# term-ui decision 14): crossterm's `EnterAlternateScreen` and
# `LeaveAlternateScreen`; dialoguer and console have none. Already in sb
# through ratatui (sb-tui).
crossterm.workspace = true
# The question's thread blocks every signal but SIGINT and job control, so
# console's key read is never interrupted by a signal sb handles (prompt.rs,
# `only_consoles_signal`); already in sb through sb-host.
nix.workspace = true
tabled.workspace = true
termtree.workspace = true
# The live block's in-place redraw (term-ui decision 15).
console_static_text.workspace = true
# The live block's test screen (`Screen`), with `testing` only; already
# in the tree through indicatif's `in_memory`.
vt100 = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tempfile.workspace = true
# The seeded generator of DisplayText's fast-path test (already a
# workspace dependency, through tempfile here too).
fastrand.workspace = true
indicatif = { workspace = true, features = ["in_memory"] }
tokio = { workspace = true, features = ["macros", "test-util"] }
# The reflowing screen of the live area's resize tests (src/reflow.rs) and
# the live block's test screen; already under indicatif's in-memory screen.
vt100.workspace = true

[lints]
workspace = true
