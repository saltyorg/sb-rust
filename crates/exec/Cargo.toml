[package]
name = "sb-exec"
version = "0.1.0"
description = "Child processes for sb's commands: one builder, cancellation, timeouts, logging and secrets (capability map, exec)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sb-cli-core.workspace = true
sb-term-ui.workspace = true
aho-corasick.workspace = true
anstream.workspace = true
rustix.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# A test step's error (term-ui's steps return anyhow's).
anyhow.workspace = true
indicatif.workspace = true
sb-term-ui = { workspace = true, features = ["testing"] }
# The children's output in files for the failure messages
# (`testing::ChildOutput`).
sb-cli-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
