[package]
name = "sb-completion"
version = "0.1.0"
description = "Tab completion for bash, zsh and fish, and the commands that install it (capability map, completion)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The command tree the engine completes, and the earlier words' parse.
clap.workspace = true
# The engine and the shells' registration stubs: `unstable-dynamic`,
# pinned exactly (ADR-001; completion spec, decision 1).
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
# The Saltbox root and the inventory's appdata root (the cache's keys).
sb-cli-core.workspace = true
# The tag cache's reader (`TagCache::load`, `cached_tags`).
sb-ansible.workspace = true
# The facts store's read-only reader (`facts::read::Store`), for the
# fact completers (completion spec, decision 15).
sb-config.workspace = true
# The earlier words unquoted as the shell passes them (bash and zsh pass
# them as typed).
shlex.workspace = true
# The shell probes (exec spec, assumption 4: `capture`, `env_clear`,
# `timeout`) and their cancellation.
sb-exec.workspace = true
tokio-util.workspace = true
# Atomic writes of the shells' files (`NamedTempFile::persist`).
tempfile.workspace = true
# sb-go's name pattern and fish's version.
regex.workspace = true
# sb-go's markers found in a file (`bytes.Contains` there).
memchr.workspace = true
# bash's descriptions measured and padded in display columns
# (`describe`), as term-ui does.
console.workspace = true
# The refresh's steps for ops' update and setup (`refresh`), and their
# bodies' errors.
sb-term-ui.workspace = true
anyhow.workspace = true

[features]
# The install root under a test's directory (`testing::ROOT_VAR`), for
# sb's tests; never in a release build.
testing = []

[dev-dependencies]
# Stand-in programs written by a child (`testing::write_program`).
sb-cli-core = { workspace = true, features = ["testing"] }
# The refresh's steps on a runner drawing to memory.
sb-term-ui = { workspace = true, features = ["testing"] }
indicatif.workspace = true
# The probes run on a real runtime in the tests.
tokio.workspace = true

[lints]
workspace = true
