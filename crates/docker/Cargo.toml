[package]
name = "sb-docker"
version = "0.1.0"
description = "sb's Docker commands: ps through bollard, start/stop/restart through the Saltbox Docker controller (capability map, docker)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake Engine API (`testing` module) for sb's end-to-end tests: built
# into the sb that `cargo test` runs (dev-dependency features unify), never
# into a release or production build.
testing = ["dep:axum", "dep:tempfile", "dep:form_urlencoded", "tokio/net", "tokio/rt", "tokio/sync"]

[dependencies]
sb-cli-core.workspace = true
sb-term-ui.workspace = true
bollard.workspace = true
# The versioned request paths, rebuilt from bollard's `http::Uri` parts
# (docker spec, "API version").
http.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures-util.workspace = true
tracing.workspace = true
# The wait's sleep between polls (start/stop/restart); the log scan's
# `task::yield_now` (`rt`, which bollard enables too).
tokio = { workspace = true, features = ["rt", "time"] }
# The Saltbox Docker controller's HTTP client (docker spec, "Start, stop
# and restart"): already in sb through sb-config.
reqwest.workspace = true
# X25519MLKEM768 offered first (ADR-027's amendment): reqwest's rustls
# leaves the feature off.
rustls = { workspace = true, features = ["prefer-post-quantum"] }
thiserror.workspace = true
# The inspect's times for the log picker (tui spec's docker amendment):
# RFC 3339 with nanoseconds, already in sb through sb-config.
jiff.workspace = true
# `systemctl is-active` for the controller's service check, and the step's
# token that cancels it (exec spec; deny.toml lets sb-docker wrap sb-exec).
sb-exec.workspace = true
tokio-util.workspace = true
axum = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }

[dev-dependencies]
sb-term-ui = { workspace = true, features = ["testing"] }
indicatif.workspace = true
form_urlencoded.workspace = true
axum.workspace = true
tempfile.workspace = true
# test-util: the wait's schedule on tokio's paused clock.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "test-util", "time"] }
tower.workspace = true
insta.workspace = true
console.workspace = true

[lints]
workspace = true
