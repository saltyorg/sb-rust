[package]
name = "sb-docker"
version = "0.1.0"
description = "sb's Docker commands: sb docker ps through bollard (capability map, docker)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake Engine API (`testing` module) for sb's end-to-end tests: built
# into the sb that `cargo test` runs (dev-dependency features unify), never
# into a release or production build.
testing = ["dep:axum", "dep:tempfile", "dep:tokio", "tokio/net", "tokio/rt", "tokio/sync", "tokio/time"]

[dependencies]
sb-cli-core.workspace = true
sb-term-ui.workspace = true
bollard.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures-util.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tower.workspace = true
insta.workspace = true
console.workspace = true

[lints]
workspace = true
