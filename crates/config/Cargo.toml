[package]
name = "sb-config"
version = "0.1.0"
description = "Saltbox's configuration: sb validate-config's schemas and checks (capability map, config)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake HTTP server (`testing` module) for sb-config's tests and sb's
# end-to-end tests: built into the sb that `cargo test` runs (dev-dependency
# features unify), never into a release or production build.
testing = ["dep:axum", "dep:tempfile", "tokio/net", "tokio/rt", "tokio/sync"]

[dependencies]
sb-cli-core.workspace = true
sb-term-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
regex.workspace = true
regex-syntax.workspace = true
jiff.workspace = true
reqwest.workspace = true
# X25519MLKEM768 offered first (ADR-027's amendment): reqwest's rustls
# leaves the feature off.
rustls = { workspace = true, features = ["prefer-post-quantum"] }
psl.workspace = true
serde_json.workspace = true
axum = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
# The Cloudflare check's wait between attempts (reqwest runs on tokio),
# and its two requests at once (`try_join!`, in sb's build through
# sb-exec already).
tokio = { workspace = true, features = ["macros", "time"] }
saphyr.workspace = true
saphyr-parser.workspace = true
thiserror.workspace = true
# The facts directory, pinned as an fd: openat, statat, flock, renameat,
# fchown, fchmod, fsync (tui spec, Editors); and motd.yml's migration:
# the Saltbox root and the backups folder opened with no link on their
# paths, every read, write and rename made through their handles
# (`process` for the euid check).
rustix = { workspace = true, features = ["fs", "process"] }
# The facts save's temp file names (tempfile's own generator).
fastrand.workspace = true

[dev-dependencies]
sb-term-ui = { workspace = true, features = ["testing"] }
indicatif.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time", "io-util"] }

[lints]
workspace = true
