[workspace]
resolver = "3"
members = ["crates/*", "prototypes/*"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

# Versions shared by the crates/ members (prototypes keep their own).
[workspace.dependencies]
sb-cli-core = { path = "crates/cli-core" }
sb-host = { path = "crates/host" }
sb-term-ui = { path = "crates/term-ui" }
sb-docker = { path = "crates/docker" }
sb-config = { path = "crates/config" }
sb-exec = { path = "crates/exec" }
sb-journal = { path = "crates/journal" }
sb-repo = { path = "crates/repo" }
sb-tui = { path = "crates/tui" }
sb-release = { path = "crates/release" }
sb-motd = { path = "crates/motd" }
sb-ansible = { path = "crates/ansible" }
sb-python-env = { path = "crates/python-env" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colorchoice-clap = "1.0.8"
anstream = "1.0.0"
anstyle = "1.0.14"
anstyle-lossy = "1.1.5"
# The DEC parser behind term-ui's `DisplayText` (already in the tree
# through anstream).
anstyle-parse = "1.0.0"
console = "0.16.6"
# term-ui's prompts (term-ui spec, "Prompts"; stack table "Prompts"):
# the confirm only for now; the password feature comes with its first user.
dialoguer = { version = "0.12.0", default-features = false }
# Only the colour type for now; tables bring `Table` with their task.
tabled = { version = "0.22.0", default-features = false, features = ["std", "ansi"] }
termtree = "1.0.0"
indicatif = "0.18.6"
# The command's runtime is current-thread (term-ui, Checkpoint A).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time"] }
clap_lex = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Pinned exactly: 0.21.1 sends unversioned request paths, which sb relies
# on (docker spec, "API version"; docs/platform-notes/docker-engine-api.md).
# An upgrade re-checks that before the pin moves.
bollard = "=0.21.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# The fake Engine API for tests only (sb-docker's `testing` feature).
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
# axum's testing pattern for the fake's own tests (`ServiceExt::oneshot`).
tower = { version = "0.5.3", default-features = false, features = ["util"] }
saphyr = { version = "0.3.3", default-features = false }
saphyr-parser = "0.3.3"
# Saltbox's schema files, typed and strict; only the deserializer
# (docs/platform-notes/musl-c-dependencies.md: no serializer or comments).
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
# Schema `pattern` rules (config spec).
regex = "1.13.1"
# Its parser, for a pattern error's reason on one line (regex's own
# error carries only the multi-line rendering).
regex-syntax = { version = "0.8.11", default-features = false, features = ["std", "unicode"] }
# Time zone files, parsed as found (`TimeZone::tzif`): no embedded
# database and no lookup of its own (config spec, decision 7).
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# The credential checks' HTTP client (config spec, "HTTP"): rustls with
# aws-lc-rs and the platform's roots (the stack table; ADR-020 for the
# glibc build), HTTP/1.1, JSON request bodies (`json`).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
# The public suffix list, compiled in, ICANN and private sections (config
# spec: the Cloudflare zone; docs/platform-notes/saltbox-schemas.md).
psl = "2.1.241"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
thiserror = "2.0.21"
# `VISUAL`/`EDITOR` split as a shell splits words, no expansion (stack
# table "Shell quoting"; tui spec, editors); already in the lockfile.
shlex = "2.0.1"
# The fake Saltbox Docker controller decodes queries with it (tests only;
# already in the tree through url).
form_urlencoded = "1.2.2"
signal-hook = "0.4.5"
tokio-util = "0.7.20"
# Secrets out of child output, overlapping matches included (exec spec).
aho-corasick = "1.1.5"
# PTY children (exec spec, `pty`); its tree checked in exec plan Task 1.
portable-pty = "0.9.0"
# `system` for sb-host's `uname(2)` (host spec, assumption 3).
rustix = { version = "1.1.6", features = ["fs", "process", "stdio", "system", "termios"] }
# /proc for motd's system sections and Disk Usage's mountinfo (motd spec,
# Tech Stack; decision 16), without chrono and flate2.
procfs = { version = "0.18.0", default-features = false }
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
# The systemd-coredump user's uid (host spec, decision 2): the version
# portable-pty already links, so no second copy, with only `user`.
nix = { version = "0.28.0", default-features = false, features = ["user"] }
# The recursive ownership walk (host spec, decision 2 and assumption 3);
# already in the lockfile.
walkdir = "2.5.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = { version = "0.2.0", default-features = false, features = ["std", "log-tracer"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "tracing-log"] }
unicode-width = "0.2.3"
# Unicode's Grapheme_Extend and Default_Ignorable_Code_Point, which std
# doesn't expose: sb's escapers keep a combining mark with its base
# character (plan decision 40). ICU4X, in the tree already through url's
# idna; its compiled data only.
icu_properties = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
# sb-journal's reader (journal spec, Tech Stack; versions and notes from
# proto-journal). siphash24 keyed by the file id, for keyed-hash files
# (JOURNAL_FILE_FORMAT, Data Objects).
siphasher = "1.0.4"
# Data payload decompression: one crate per algorithm, all pure Rust.
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode"] }
# 0.9.1 fixes RUSTSEC-2026-0344 (decompression bomb).
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
# Without `optimization` it is forbid(unsafe_code); its reader takes a
# memory limit (lzma-rs 0.3.0 had none for xz, and no release since 2023).
# Never enable `optimization`.
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
# 128-bit ids; already in sb's tree through bollard.
hex = "0.4.3"
# The per-file union of a page's entry lists (`kmerge_by`); already in the
# tree through ratatui.
itertools = "0.14.0"
# Re-seals an xz block header in a corruption test (sb-journal's tests
# only); already in the tree.
crc32fast = "1.5.3"
# The fuzz harness's PRNG (sb-journal's `testing` feature only), seeded per
# case so each case reproduces; already in the tree through tempfile.
fastrand = "2.5.0"
# sb's screens (tui spec, Tech Stack). ratatui and ratatui-core are pinned
# exactly: `unstable-rendered-line-info` is an unstable feature (ADR-001
# decision 1). No default `all-widgets`: the calendar widget pulls `time`.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
# `From<anstyle::Color>` for the palette and log spans (map decision 10),
# the version ratatui 0.30.2 uses (ADR-001 decision 1).
ratatui-core = { version = "=0.1.2", features = ["anstyle"] }
# Raw mode, the alternate screen, mouse capture and the async `EventStream`.
crossterm = { version = "0.29.0", features = ["event-stream"] }
# SGR in log text to ratatui `Text` (ratatui org).
ansi-to-tui = "8.0.1"
# The picker's name filter line (ratatui org; tui spec, Tech Stack: 0.9.4
# was under two weeks old when the spec was checked).
ratatui-textarea = "0.9.3"
# The PTY tests' screen (tests only; already in the tree through
# indicatif's `in_memory`).
vt100 = "0.16.2"
# Release tags and the running version (stack table "Versions"; release
# spec); already in the tree as a build dependency.
semver = "1.0.28"
# Streamed SHA-256 of downloads (stack table "Self-update"; release spec);
# already in the tree through lzma-rust2.
sha2 = "0.11.1"
# The ELF header of a downloaded binary (release spec, "ELF check"; R7):
# its ELF reader only, no std, no other formats. goblin is the
# alternative, with less adoption.
object = { version = "0.41.0", default-features = false, features = ["read_core", "elf"] }
# sb-release's fake GitHub for tests only (its `testing` feature): a
# loopback certificate made at test time, no key in the repository
# (release spec, Tech Stack). aws-lc-rs as the client's rustls, not ring.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
# The fake's TLS listener (axum's low-level-rustls example); already in
# the tree through reqwest.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
assert_cmd = "2.2.1"
predicates = "3.1.4"
insta = "1.49.0"
tempfile = "3.27.0"
# install's tag suggestions (stack table "Fuzzy match"; ansible spec,
# step 5): already in the tree through clap.
strsim = "0.11.1"
# sb list's tag columns, filled top to bottom as `ls` fills them (ansible
# spec, decision 16; plan decision 8).
uutils_term_grid = "0.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"
# With clippy::pedantic (exec Task 10): every public type can be debugged,
# and no cast to the type a value already has.
missing_debug_implementations = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
# The whole pedantic group (maintainer, 2026-11-05; exec Task 10), at a
# lower priority so a single lint can still be set on its own.
pedantic = { level = "warn", priority = -1 }
# CLAUDE.md: #[allow] is forbidden; justified exceptions use #[expect(lint, reason = "...")].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# CONSTRAINTS.md floor: no unfinished stubs or leftover debug output.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# What a shipped binary would be built with (`--profile production`).
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
