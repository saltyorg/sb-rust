# cargo-nextest's configuration (https://nexte.st/docs/configuration/).
# scripts/check.sh runs nextest in its mutation passes, with the
# `mutants` profile (ADR-021), and for the crates' tests in a release
# build, with `release-tests`; every other test run is cargo test or
# cargo llvm-cov.

[profile.mutants]
# A test still running after 2 periods of 30 s is ended and counts as
# failed, so a mutant that makes a test hang is caught there rather than
# at the whole mutant's 300 s timeout, which counts as not caught
# (https://nexte.st/docs/features/slow-tests/#terminating-tests-after-a-timeout;
# on-timeout's default is "fail"). 60 s is about six times the slowest
# test measured under nextest on the unmutated tree (ADR-021). A mutated
# crate's test that the unmutated tree can't pass within it fails
# cargo-mutants' baseline, which check.sh refuses as no verdict.
slow-timeout = { period = "30s", terminate-after = 2 }
# The first failure decides the mutant (caught), so the tests still
# running are ended at once instead of waited for: a hung test then costs
# nothing once another test has failed
# (https://nexte.st/docs/running/#termination-behavior, since 0.9.111).
fail-fast = { max-fail = 1, terminate = "immediate" }

[profile.release-tests]
# The gate's release-build test run (scripts/check.sh, `task`). The same
# per-test end as the mutation passes': a test still running after 60 s
# fails, so a hang fails the gate rather than holds it up. Every failure
# is reported, not the first alone: it runs once, not once a mutant.
# Only failures and slow tests are listed, during the run and at its
# end, with the summary, so the gate's log doesn't hold a line for each
# of thousands of passing tests, yet a test that is slow under the
# host's load still shows its 30 s warning before it fails
# (https://nexte.st/docs/reporting/#status-levels; the
# profile keys as nextest-runner 0.129.0 sets them in its own default,
# https://docs.rs/crate/nextest-runner/0.129.0/source/default-config.toml).
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false
status-level = "slow"
final-status-level = "slow"
