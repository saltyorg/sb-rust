[package]
name = "proto-logs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
jiff = "0.2.38"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }

# musl's allocator made static builds ~40% slower per frame (see FINDINGS.md).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[lints]
workspace = true
