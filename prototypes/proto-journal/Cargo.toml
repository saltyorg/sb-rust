[package]
name = "proto-journal"
version = "0.1.0"
description = "Prototype: our own read-only systemd journal reader (tasks/prototypes Task 11)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# siphash24 keyed by the file id, for keyed-hash files (JOURNAL_FILE_FORMAT, Data Objects).
siphasher = "1.0.2"
# Data payload decompression: one crate per algorithm, all pure Rust.
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode"] }
# 0.9.1 fixes RUSTSEC-2026-0344 (decompression bomb).
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
# Without `optimization` it is forbid(unsafe_code); its reader takes a
# memory limit (lzma-rs 0.3.0 had none for xz, and no release since 2023).
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
# 128-bit ids in cursors; already in sb's tree through bollard.
hex = "0.4.3"
# VERSION_ID, as sb-host reads it.
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
# inotify for following; pread comes from std's FileExt. `process`: the
# fuzz harness's address-space limit.
rustix = { version = "1.1.6", features = ["fs", "process"] }
# The fuzz harness's seeded randomness; already in the tree through tempfile.
fastrand = "2.5.0"
# The systemd-coredump uid for 26.04's unit match (host spec decision 2).
nix = { version = "0.28.0", default-features = false, features = ["user"] }
serde_json = "1.0.154"
# kmerge_by for the newest-first union of entry lists; 0.14.0 is already in
# sb's tree through ratatui.
itertools = "0.14.0"


[dev-dependencies]
# Crafted journal files for the parser tests.
tempfile = "3.27.0"
# Re-seals an xz block header in a corruption test; already in the tree.
crc32fast = "1.5.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
