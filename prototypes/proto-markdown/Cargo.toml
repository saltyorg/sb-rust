[package]
name = "proto-markdown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
proto-theme = { version = "0.1.0", path = "../proto-theme" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
termimad = "0.35.5"
tui-markdown = "0.3.12"
tui-scrollview = "0.6.8"

# The workspace's lints before clippy::pedantic (exec Task 10): a
# prototype keeps the lints it was written and reviewed under until it is
# removed (maintainer, 2026-11-06).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
