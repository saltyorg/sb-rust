[package]
name = "proto-inline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
colorchoice-clap = "1.0.8"
console = "0.16.6"
dialoguer = "0.12.0"
futures = "0.3.34"
proto-theme = { path = "../proto-theme" }
ratatui = { version = "0.30.2", default-features = false }
tabled = { version = "0.22.0", features = ["ansi"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
