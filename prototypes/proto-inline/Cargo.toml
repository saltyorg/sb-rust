[package]
name = "proto-inline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
colorchoice-clap = "1.0.8"
comfy-table = "8.0.1"
console = "0.16.6"
# Must stay the copy comfy-table styles through, or set_ansi_color_disabled
# stops reaching the table (one crossterm in Cargo.lock today).
crossterm = "0.29.0"
dialoguer = "0.12.0"
proto-theme = { path = "../proto-theme" }
ratatui = { version = "0.30.2", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
