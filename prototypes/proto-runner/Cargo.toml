[package]
name = "proto-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
indicatif = "0.18.6"
portable-pty = "0.9.0"
proto-theme = { version = "0.1.0", path = "../proto-theme" }
ratatui = { version = "0.30.2", default-features = false }
rustix = { version = "1.1.6", features = ["process", "termios", "stdio"] }
signal-hook = "0.4.5"
termtree = "1.0.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "signal"] }
tokio-util = "0.7.20"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
