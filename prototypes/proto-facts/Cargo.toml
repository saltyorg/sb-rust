[package]
name = "proto-facts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
proto-theme = { version = "0.1.0", path = "../proto-theme" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.3"
tempfile = "3.27.0"
tui-popup = "0.7.7"

# The workspace's lints before clippy::pedantic (exec Task 10): a
# prototype keeps the lints it was written and reviewed under until it is
# removed (maintainer, 2026-11-06).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
