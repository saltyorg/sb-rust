# cargo-deny configuration (CONSTRAINTS.md, "Dependencies" and
# "Architecture"). Format: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# The gate runs on the shipped binary's graph:
#   cargo deny --manifest-path crates/sb/Cargo.toml check
# so the prototypes' dependencies don't count.

[graph]
# Only what we ship (decision 6, ADR-020): glibc on amd64 and arm64.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Any RustSec vulnerability fails; unmaintained crates fail anywhere in the
# graph. An ignore needs a CONSTRAINTS.md Exceptions row.
unmaintained = "all"
yanked = "deny"
ignore = [
    # CONSTRAINTS.md exception E1: syntect (tui-markdown's code highlighting)
    # needs these two; unmaintained, not vulnerable.
    { id = "RUSTSEC-2025-0141", reason = "E1: bincode via syntect, reads only syntax dumps built into the binary" },
    { id = "RUSTSEC-2024-0320", reason = "E1: yaml-rust via syntect, used only by syntect" },
]

[licenses]
# Compatible with the project's GPL-3.0-only licence. Adding one needs a
# reason in the commit and a CONSTRAINTS.md review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicates are reported, not failed: they come from upstream version
# skew we don't control. Wildcard version requirements fail.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version requirement.
allow-wildcard-paths = true
# lzma-rust2 is `forbid(unsafe_code)` only without `optimization`
# (sb-journal's xz payloads; ADR-013).
features = [
    { crate = "lzma-rust2", deny = ["optimization"] },
]
# Architecture: one entry per crates/ crate, listing the crates allowed to
# depend on it directly (`wrappers`), from the capability map's
# "Depends on" column. Added with each crate.
deny = [
    # cli-core: every module builds on it.
    { crate = "sb-cli-core", wrappers = ["sb", "sb-ops", "sb-term-ui", "sb-docker", "sb-config", "sb-exec", "sb-tui", "sb-release", "sb-repo", "sb-host", "sb-motd", "sb-ansible", "sb-python-env"] },
    # term-ui: the inline output layer; docker and config draw through it
    # with their crates; host's apt streams into its steps.
    { crate = "sb-term-ui", wrappers = ["sb", "sb-ops", "sb-docker", "sb-config", "sb-exec", "sb-tui", "sb-release", "sb-repo", "sb-host", "sb-motd", "sb-ansible", "sb-python-env"] },
    # exec: child processes; its first user is sb-docker's start, stop and
    # restart (exec spec, decision 4); sb-host's systemctl calls; the
    # binary's `sb edit`, which runs the editor attached (tui spec,
    # editors: crates/sb/src/edit.rs); python-env's uv, Python and git;
    # ops' locale programs and git hooks.
    { crate = "sb-exec", wrappers = ["sb", "sb-ops", "sb-docker", "sb-release", "sb-host", "sb-repo", "sb-motd", "sb-ansible", "sb-python-env"] },
    # docker: sb docker ps (and later start/stop/restart, the picker's
    # list, log streams), used by the binary.
    { crate = "sb-docker", wrappers = ["sb", "sb-tui", "sb-motd"] },
    # host: the supported-release check and the journal reader's wrapper
    # (sb-journal's types and its tokio glue), used by the binary; ops'
    # apt sequence and sources for setup and gha.
    { crate = "sb-host", wrappers = ["sb", "sb-ops", "sb-tui", "sb-repo", "sb-motd", "sb-ansible", "sb-python-env"] },
    # journal: sb's own journal reader, depending on nothing of sb's and
    # wrapped by host (journal spec, "Capability map correction"). Its own
    # name is its self dev-dependency, which turns `testing` on for its
    # tests (sb-journal plan, "Code with no user yet").
    { crate = "sb-journal", wrappers = ["sb-host", "sb-journal"] },
    # repo: git on Saltbox's checkouts (repo spec); used by ops' branch
    # commands (and later update and setup) and ansible. Its own name is
    # its self dev-dependency, which turns `testing` on for its tests (as
    # sb-journal's).
    { crate = "sb-repo", wrappers = ["sb-ops", "sb-repo", "sb-ansible"] },
    # config: sb validate-config's schemas and checks, used by the binary.
    { crate = "sb-config", wrappers = ["sb", "sb-motd", "sb-ops"] },
    # tui: sb's full-screen screens (the log picker and viewer, the
    # editors) over docker, host, term-ui and cli-core, used by the binary
    # (tui spec, "Gate bookkeeping"), and by ops for the announcements'
    # inline form (ops spec, assumption 4).
    { crate = "sb-tui", wrappers = ["sb", "sb-ops"] },
    # release: GitHub release lookup, verified downloads and sb
    # self-update, used by the binary (and later python-env and ops). Its
    # own name is its self dev-dependency, which turns `testing` on for
    # its tests (as sb-journal's).
    { crate = "sb-release", wrappers = ["sb", "sb-release", "sb-python-env", "sb-ops"] },
    # motd: `sb motd`, the login's status, over cli-core, term-ui, exec,
    # host, config and docker (capability map motd row; motd spec,
    # Project Structure), used by the binary.
    { crate = "sb-motd", wrappers = ["sb"] },
    # ansible: playbook runs by tag, the tag listing and its cache (sb
    # install, list and diag) over exec, host, repo, term-ui and cli-core
    # (ansible spec, amendment 4), used by the binary (and later
    # completion and ops).
    { crate = "sb-ansible", wrappers = ["sb", "sb-ops"] },
    # python-env: the uv-managed Python, the Ansible venv, deadsnakes and
    # saltbox.fact (python-env spec), over exec, term-ui, host and release;
    # used by the binary and by ops (gha, setup, update). Its own name is
    # its self dev-dependency, which turns `testing` on for its tests (as
    # sb-repo's).
    { crate = "sb-python-env", wrappers = ["sb", "sb-ops", "sb-python-env"] },
    # ops: the workflow commands (update, the branch commands,
    # announcements, setup, restore, bench, gha) over the other modules
    # (ops spec, Project Structure), used by the binary. Its own name is
    # its self dev-dependency, which turns `testing` on for its tests (as
    # sb-python-env's).
    { crate = "sb-ops", wrappers = ["sb", "sb-ops"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
